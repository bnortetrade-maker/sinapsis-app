  }

  let homeWaveRAF = null, homeWaveEnergy = 0, homeWaveT = 0;
  function stopHomeWaveAnim(){ if(homeWaveRAF) cancelAnimationFrame(homeWaveRAF); homeWaveRAF = null; }
  function startHomeWaveAnim(){
    stopHomeWaveAnim();
    const frame = ()=>{
      const wrap = $("#homeWave");
      if(!wrap){ stopHomeWaveAnim(); return; }
      const bars = wrap.children;
      homeWaveT += 1; homeWaveEnergy *= 0.86;
      const phase = state.homeVoice.phase;
      for(let i=0;i<bars.length;i++){
        let h;
        if(phase==="idle") h = 4;
        else if(phase==="thinking") h = 8 + Math.sin(homeWaveT*0.12 + i*0.5)*6;
        else if(phase==="listening") h = 5 + Math.abs(Math.sin(homeWaveT*0.22 + i*0.7)) * (7 + homeWaveEnergy*20);
        else h = 6 + Math.abs(Math.sin(homeWaveT*0.32 + i*0.9)) * 17; // speaking
        bars[i].style.height = Math.max(3, Math.min(36, h)).toFixed(1) + "px";
      }
      homeWaveRAF = requestAnimationFrame(frame);
    };
    frame();
  }

  function startHomeVoiceChat(){
    state.homeVoice.active = true;
    state.homeVoice.silenceStreak = 0;
    listenOneHomeTurn();
  }

  function stopHomeVoiceChat(){
    state.homeVoice.active = false;
    state.homeVoice.phase = "idle";
    state.homeVoice.transcript = "";
    if(state.homeVoice.recog){ try{ state.homeVoice.recog.stop(); }catch(e){} }
    if(canSpeak) window.speechSynthesis.cancel();
    render();
  }

  function listenOneHomeTurn(){
    if(!state.homeVoice.active || !canListen) return;
    state.homeVoice.phase = "listening";
    state.homeVoice.transcript = "";
    render();
    const rec = new SpeechRec();
    rec.lang = (navigator.language||"es-ES").startsWith("es") ? navigator.language : "es-ES";
    rec.continuous = false; rec.interimResults = true;
    let finalText = "", gotResult = false;
    rec.onresult = (e)=>{
      gotResult = true; homeWaveEnergy = 1;
      let interim = "";
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal) finalText += t + " "; else interim += t;
      }
      state.homeVoice.transcript = (finalText + interim).trim();
      updateHomeVoiceUI();
    };
    rec.onerror = (e)=>{
      if(e && (e.error==="not-allowed" || e.error==="service-not-allowed")){
        toast("Permiso de micrófono denegado para la conversación por voz.");
        stopHomeVoiceChat();
      }
      // "no-speech" y otros errores leves se resuelven en onend, reintentando.
    };
    rec.onend = ()=>{
      if(!state.homeVoice.active) return;
      const text = finalText.trim();
      if(text){
        state.homeVoice.silenceStreak = 0;
        sendHomeVoiceTurn(text);
      } else {
        state.homeVoice.silenceStreak += 1;
        // Tras varios turnos sin voz, se pausa sola en vez de escuchar para siempre.
        if(state.homeVoice.silenceStreak >= 4){
          toast("Conversación en pausa por inactividad — toca el micrófono para seguir.");
          stopHomeVoiceChat();
        } else {
          setTimeout(()=>{ if(state.homeVoice.active) listenOneHomeTurn(); }, 400);
        }
      }
    };
    try{ rec.start(); state.homeVoice.recog = rec; }
    catch(e){ setTimeout(()=>{ if(state.homeVoice.active) listenOneHomeTurn(); }, 500); }
  }

  async function sendHomeVoiceTurn(text){
    state.homeChat.push({ role:"user", content:text });
    state.homeVoice.phase = "thinking";
    state.homeVoice.transcript = "";
    render();
    try{
      // Detectar comandos de generación de documentos (patrones amplios en español)
      const lowerText = text.toLowerCase();
      let exportCommand = null;
      if(/\bpdf\b/i.test(lowerText)) exportCommand = "pdf";
      else if(/\bword\b|\bdocx\b/i.test(lowerText)) exportCommand = "docx";
      else if(/\bppt\b|\bpower\s*point\b|\bpptx\b|\bpresentaci[oó]n\b|\bdiapositivas?\b|\bslides?\b/i.test(lowerText)) exportCommand = "pptx";

      const cleanTopic = (s)=> s.replace(/\b(pdf|word|docx|ppt|power\s*point|pptx|presentaci[oó]n|diapositivas?|slides?|genera(me)?|crea(me)?|hazme|hacer|quiero|necesito|un|una|de|del|sobre|acerca|eso|esto)\b/gi,"").replace(/\s+/g," ").trim();

      if(exportCommand){
        // Buscar la última respuesta larga de Sinapsis (material real) y la pregunta que la originó (tema/título)
        const idx = [...state.homeChat].map((m,i)=>({m,i})).reverse().find(({m})=> m.role==="assistant" && m.content.length>50);
        const lastAssistantMsg = idx ? idx.m : null;
        const originatingUserMsg = idx && idx.i>0 ? state.homeChat[idx.i-1] : null;
        const materialText = lastAssistantMsg ? lastAssistantMsg.content : text;
        const rawTopic = lastAssistantMsg ? (cleanTopic(originatingUserMsg?.content||"") || cleanTopic(text)) : cleanTopic(text);
        const topicTitle = (rawTopic || "Documento de estudio").slice(0,60);

        toast(`📥 Generando ${exportCommand.toUpperCase()}… (esto puede tardar unos segundos)`);
        render();
        (async ()=>{
          try{
            const outline = await getStudyOutline(topicTitle, materialText);
            if(exportCommand === "pdf") await exportPdf(outline, topicTitle);
            else if(exportCommand === "docx") await exportDocx(outline, topicTitle);
            else if(exportCommand === "pptx") await exportPptx(outline, topicTitle);
          }catch(e){
            toast("⚠️ No se pudo generar el documento: " + (e.message||errorCopy(e)));
          }
        })();
        // Confirmar por voz de inmediato en vez de esperar a Claude
        const confirmMsg = `Listo, te estoy generando el ${exportCommand==="pptx"?"PowerPoint":exportCommand==="docx"?"documento Word":"PDF"} de "${topicTitle}". Aparecerá para descargar en unos segundos.`;
        state.homeChat.push({ role:"assistant", content: confirmMsg });
        state.homeVoice.phase = "speaking";
        render();
        if(canSpeak){
          window.speechSynthesis.cancel();
          speakText(confirmMsg, null, ()=>{
            if(!state.homeVoice.active){ state.homeVoice.phase = "idle"; render(); return; }
            state.homeVoice.phase = "idle";
            listenOneHomeTurn();
          });
        } else if(state.homeVoice.active){
          listenOneHomeTurn();
        } else {
          state.homeVoice.phase = "idle"; render();
        }
        return;
      }

      // Haiku 4.5 + menos tokens: respuestas conversacionales cortas no
      // necesitan el modelo grande, y el techo de tokens bajo evita que se
      // extienda de más — ambas cosas la hacen sentir mucho más ágil hablando.
      const { text: answer } = await callClaude(state.homeChat, { model: MODEL_QUICK, system: homeVoiceSystemPrompt(), maxTokens: 700 });
      state.homeChat.push({ role:"assistant", content: answer });
      rememberTopic(cleanTopic(text).slice(0,60)); // auto-aprendizaje: recuerda de qué hablaron
      state.homeVoice.phase = "speaking";
      render();
      if(canSpeak){
        window.speechSynthesis.cancel();
        speakText(answer, null, ()=>{
          if(!state.homeVoice.active){ state.homeVoice.phase = "idle"; render(); return; }
          state.homeVoice.phase = "idle";
          listenOneHomeTurn();
        });
      } else if(state.homeVoice.active){
        listenOneHomeTurn();
      } else {
        state.homeVoice.phase = "idle"; render();
      }
    }catch(e){
      toast(errorCopy(e));
      state.homeVoice.phase = "idle";
      render();
      if(state.homeVoice.active) setTimeout(()=>{ if(state.homeVoice.active) listenOneHomeTurn(); }, 800);
    }
  }

        </div>

            <label>¿Cuántas tarjetas?</label>

              ${[10,15,20].map(n=>`<button class="chip ${state.genCount===n?'active':''}" data-count="${n}">${n}</button>`).join("")}

          </div>
          <button class="btn btn-eosin" id="genBtn" ${state.genBusy? "disabled":""}>${state.genBusy? `Generando ${state.genCount} tarjetas…` : `✨ Generar ${state.genCount} tarjetas con IA`}</button>

    $("#topicInput").oninput = e=> state.genTopic = e.target.value;
    $$("[data-count]").forEach(b=> b.onclick = ()=>{ state.genCount = +b.dataset.count; renderCardsScreen(); });
    $("#genBtn").onclick = ()=>{

      if(topic) generateDeck(topic, state.genCount); else toast("Escribe o elige un tema primero.");
    };

      e.stopPropagation();

      const cards = state.cards.filter(c=>c.deckId===deck.id);

      openExportMenu(deck.name, material);

    return `<div class="deck-item deck-item-click" data-open-deck="${deck.id}" style="cursor:pointer">

      <div class="deck-info">

      </div>
      <div class="deck-actions">

  function openDeckDetail(deckId){
    state.deckDetail = deckId;
    state.deckDetailSelected = [];
    render();
  }

  function renderDeckDetailScreen(){
    const deck = state.decks.find(d=>d.id===state.deckDetail);
    if(!deck){ state.deckDetail = null; return renderCardsScreen(); }
    const cards = state.cards.filter(c=>c.deckId===deck.id);
    const selected = state.deckDetailSelected;
    const allSelected = cards.length>0 && selected.length===cards.length;
    content.innerHTML = `
      <div class="screen">
        <div class="section-head" style="justify-content:space-between">
          <button class="icon-link" id="backToDecksBtn">← Volver a Flashcards</button>
          <button class="icon-link" id="deleteWholeDeckBtn" style="color:var(--eosin)">🗑️ Borrar mazo completo</button>
        </div>
        <h2 class="section-title" style="font-size:20px">${escapeHtml(deck.name)}</h2>
        <p class="lede">${cards.length} tarjeta${cards.length===1?"":"s"} · Selecciona las que quieras borrar, o borra todo el mazo arriba</p>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn btn-soft btn-sm" id="selectAllCardsBtn">${allSelected? "Deseleccionar todas":"Seleccionar todas"}</button>
          <button class="btn btn-eosin btn-sm" id="deleteSelectedCardsBtn" ${selected.length? "":"disabled"}>🗑️ Borrar seleccionadas (${selected.length})</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
          ${cards.length ? cards.map(c=>`
            <label class="card-select-item" style="display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface);cursor:pointer">
              <input type="checkbox" class="card-select-check" data-card-id="${c.id}" ${selected.includes(c.id)?"checked":""} style="margin-top:3px">
              <div style="flex:1;min-width:0">
                <div style="font-weight:600;font-size:13.5px">${escapeHtml(c.front)}</div>
                <div style="font-size:12.5px;color:var(--ink-soft);margin-top:3px">${escapeHtml(c.back)}</div>
              </div>
            </label>
          `).join("") : `<div class="empty-note">Este mazo no tiene tarjetas.</div>`}
        </div>
      </div>
    `;
    $("#backToDecksBtn").onclick = ()=>{ state.deckDetail = null; render(); };
    const deleteDeckBtn = $("#deleteWholeDeckBtn");
    let deckDeleteArmed = false;
    deleteDeckBtn.onclick = ()=>{
      if(!deckDeleteArmed){
        deckDeleteArmed = true;
        deleteDeckBtn.textContent = "¿Seguro? Toca de nuevo para borrar todo";
        setTimeout(()=>{ deckDeleteArmed = false; if($("#deleteWholeDeckBtn")) $("#deleteWholeDeckBtn").textContent = "🗑️ Borrar mazo completo"; }, 3000);
        return;
      }
      deleteDeck(deck.id);
      state.deckDetail = null;
      render();
    };
    $("#selectAllCardsBtn").onclick = ()=>{
      state.deckDetailSelected = allSelected ? [] : cards.map(c=>c.id);
      renderDeckDetailScreen();
    };
    $("#deleteSelectedCardsBtn").onclick = ()=>{
      const n = selected.length;
      selected.forEach(id=> deleteCard(id));
      state.deckDetailSelected = [];
      toast(`${n} tarjeta${n===1?"":"s"} borrada${n===1?"":"s"}`);
      renderDeckDetailScreen();
    };
    $$(".card-select-check").forEach(chk=>{
      chk.onchange = ()=>{
        const id = chk.dataset.cardId;
        if(chk.checked){ if(!state.deckDetailSelected.includes(id)) state.deckDetailSelected.push(id); }
        else { state.deckDetailSelected = state.deckDetailSelected.filter(x=>x!==id); }
        // Solo actualizar los botones de arriba, sin perder el foco del checkbox
        const delBtn = $("#deleteSelectedCardsBtn");
        delBtn.textContent = `🗑️ Borrar seleccionadas (${state.deckDetailSelected.length})`;
        delBtn.disabled = state.deckDetailSelected.length===0;
      };
    });
  }

  function startReview(){
    state.review = { active:true, queue: dueCards(), idx:0, flipped:false };
    render();
  }

  function renderReview(){
    const { queue, idx } = state.review;
    if(idx >= queue.length){
      content.innerHTML = `<div class="screen">
        <div class="card" style="text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:32px 20px">
          <div style="font-size:34px">✅</div>
          <h2 class="section-title">¡Repaso completo!</h2>
          <p class="lede">Vuelve mañana para seguir con la racha.</p>
          <button class="btn btn-primary" id="doneBtn" style="width:auto">Volver a Flashcards</button>
        </div>
      </div>`;
      $("#doneBtn").onclick = ()=>{ state.review.active=false; render(); };
      return;
    }
    const card = queue[idx];
    const deck = state.decks.find(d=>d.id===card.deckId);
    content.innerHTML = `
      <div class="screen">
        <div class="section-head">
          <div class="eyebrow mono">TARJETA ${idx+1}/${queue.length} · ${escapeHtml((deck&&deck.topic)||"").toUpperCase()}</div>
        </div>
        <div class="flip-scene">
          <div class="flip-card" id="flipCard">
            <div class="flip-face front">
              <span class="specimen-tag">Pregunta</span>
              <div class="flip-text">${escapeHtml(card.front)}</div>
              <div class="flip-hint">Toca para voltear</div>
            </div>
            <div class="flip-face back">
              <span class="specimen-tag" style="background:#fff3;color:var(--eosin)">Respuesta</span>
              <div class="flip-text">${escapeHtml(card.back)}</div>
            </div>
          </div>
        </div>
        <div class="grade-row" id="gradeRow" style="visibility:hidden">
          <button class="btn grade-btn g-again" data-q="2">Otra vez<small>&lt;1 d</small></button>
          <button class="btn grade-btn g-hard" data-q="3">Difícil<small>~1 d</small></button>
          <button class="btn grade-btn g-good" data-q="4">Bien<small>días</small></button>
          <button class="btn grade-btn g-easy" data-q="5">Fácil<small>+días</small></button>
          <button class="btn" id="deleteCardBtn" style="background:var(--eosin);color:white">🗑️ Borrar</button>
        </div>
      </div>
    `;
    const flip = $("#flipCard");
    flip.onclick = ()=>{
      state.review.flipped = !state.review.flipped;
      flip.classList.toggle("flipped", state.review.flipped);
      $("#gradeRow").style.visibility = state.review.flipped ? "visible":"hidden";
    };
    $$("[data-q]").forEach(b=> b.onclick = (e)=>{
      e.stopPropagation();
      recordReview(card, +b.dataset.q);
      state.review.idx += 1; state.review.flipped = false;
      render();
    });
    const deleteBtn = $("#deleteCardBtn");
    if(deleteBtn){
      deleteBtn.onclick = (e)=>{
        e.stopPropagation();
        deleteCard(card.id);
        // Tras borrar, el arreglo se corrió una posición: el mismo idx ya
        // apunta a la siguiente tarjeta. Solo hay que evitar que quede fuera
        // de rango (idx negativo rompía el render con la tarjeta undefined).
        if(state.review.idx >= state.review.queue.length) state.review.idx = state.review.queue.length;
        state.review.flipped = false;
        render();
      };
    }
  }

          <div class="note-btn-row" style="width:100%">

      $("#recModeLive") && ($("#recModeLive").onclick = ()=>{ state.recMode = "live"; renderModeArea(); });

    $("#backToAgenda1").onclick = back;
    $("#remType").onchange = e=> state.remForm.type = e.target.value;
    $("#remDate").oninput = e=> state.remForm.date = e.target.value;
    $("#remTitle").oninput = e=> state.remForm.title = e.target.value;
    $("#remSubject").oninput = e=> state.remForm.subject = e.target.value;
    $("#addRemBtn").onclick = ()=>{
      const title = $("#remTitle").value.trim(), date = $("#remDate").value;
      if(!title || !date){ toast("Falta el título o la fecha."); return; }
      const entry = { id:"r"+Math.random().toString(36).slice(2,10), title, date, type:$("#remType").value, subject:$("#remSubject").value.trim() };
      state.reminders.push(entry); saveReminders();
      state.remForm = { title:"", type:"Parcial", date:"", subject:"" };
      toast("Recordatorio guardado.");
      back();
    };
  }

  function renderAddClassScreen(){
    content.innerHTML = `
      <div class="screen">
        <div class="section-head">
          <div><div class="eyebrow">Agenda</div><h2 class="section-title">Nueva clase</h2></div>
          <button class="btn btn-ghost btn-sm" id="backToAgenda2">← Volver</button>
        </div>
        <div class="card" style="display:flex;flex-direction:column;gap:10px">
          <div class="field-row">
            <div class="field"><label>Día</label><select id="schedDay">${DAYS.map(d=>`<option ${state.schedForm.day===d?"selected":""}>${d}</option>`).join("")}</select></div>
            <div class="field"><label>Hora</label><input type="time" id="schedTime" value="${state.schedForm.time}"></div>
          </div>
          <div class="field"><label>Materia</label><input type="text" id="schedSubject" placeholder="Ej. Anatomía" value="${escapeHtml(state.schedForm.subject)}"></div>
          <div class="field"><label>Lugar (opcional)</label><input type="text" id="schedPlace" placeholder="Ej. Aula 302" value="${escapeHtml(state.schedForm.place)}"></div>
          <button class="btn btn-primary" id="addSchedBtn">Guardar en el horario</button>
        </div>
      </div>
    `;
    const back = ()=>{ state.tab = "agenda"; render(); };
    $("#backToAgenda2").onclick = back;
    $("#schedDay").onchange = e=> state.schedForm.day = e.target.value;
    $("#schedTime").oninput = e=> state.schedForm.time = e.target.value;
    $("#schedSubject").oninput = e=> state.schedForm.subject = e.target.value;
    $("#schedPlace").oninput = e=> state.schedForm.place = e.target.value;
    $("#addSchedBtn").onclick = ()=>{
      const time = $("#schedTime").value, subject = $("#schedSubject").value.trim();
      if(!time || !subject){ toast("Falta la hora o la materia."); return; }
      const entry = { id:"s"+Math.random().toString(36).slice(2,10), day:$("#schedDay").value, time, subject, place:$("#schedPlace").value.trim() };
      state.schedule.push(entry); saveSchedule();
      state.schedForm = { day:$("#schedDay").value, time:"", subject:"", place:"" };
      toast("Clase agregada al horario.");
      back();
    };
  }

  function reminderItem(r){
    const d = daysUntil(r.date);
    const cls = d < 0 ? "over" : d<=1 ? "" : "zero";
    const when = d < 0 ? `hace ${-d} d` : d===0 ? "¡hoy!" : d===1 ? "mañana" : `en ${d} d`;
    return `<div class="reminder-item">
      <div style="flex:1;min-width:0">
        <div class="type-chip">${escapeHtml(r.type)}</div>
        <div class="sched-subject">${escapeHtml(r.title)}</div>
        ${r.subject? `<div class="sched-place">${escapeHtml(r.subject)}</div>`:""}
      </div>
      <div class="due-pill ${cls}">${when}</div>
      <button class="icon-link del-rem" data-id="${r.id}">✕</button>
    </div>`;
  }
  function schedItem(s){
    return `<div class="sched-item">
      <div class="sched-time mono">${s.time}</div>
      <div class="sched-info"><div class="sched-subject">${escapeHtml(s.subject)}</div>${s.place?`<div class="sched-place">${escapeHtml(s.place)}</div>`:""}</div>
      <button class="icon-link del-sched" data-id="${s.id}">✕</button>
    </div>`;
  }

  /* ---------- Progress ---------- */
  function renderProgressScreen(){
    const total = state.stats.totalReviews||0, correct = state.stats.correctReviews||0;
    const acc = total? Math.round(correct/total*100) : 0;
    const mastered = state.cards.filter(c=>c.interval>=21).length;
    const days = [...Array(7)].map((_,i)=>{
      const d = new Date(Date.now()-(6-i)*86400000);
      const key = d.toISOString().slice(0,10);
      return { key, label: d.toLocaleDateString(undefined,{weekday:"narrow"}), count: state.stats.daily[key]||0 };
    });
    const maxCount = Math.max(1, ...days.map(d=>d.count));
    content.innerHTML = `
      <div class="screen">
        <div class="eyebrow">Progreso</div>
        <h2 class="section-title">Cómo vas</h2>

        <div class="card" style="display:flex;flex-direction:column;gap:8px">
          <label>Tu etapa actual</label>
          <div style="display:flex;gap:8px">
            <input type="text" id="stageInput" placeholder="Ej. 3er semestre, Rotación de Pediatría…" value="${escapeHtml(state.stageDraft)}">
            <button class="btn btn-soft btn-sm" id="saveStageBtn">Guardar</button>
          </div>
          <p class="lede">Esto ajusta el nivel de Sinapsis, las tarjetas y los resúmenes. Actualízalo cuando avances.</p>
        </div>

        <div class="stat-row">
          <div class="stat-tile"><div class="stat-num mono">${state.stats.streakDays}</div><div class="stat-label">Racha (días)</div></div>
          <div class="stat-tile"><div class="stat-num mono">${acc}%</div><div class="stat-label">Aciertos</div></div>
          <div class="stat-tile"><div class="stat-num mono">${mastered}</div><div class="stat-label">Dominadas</div></div>
        </div>
        <div class="card">
          <div class="eyebrow" style="margin-bottom:10px">Últimos 7 días</div>
          <div class="bars">${days.map(d=>`<div class="bar-col"><div class="bar ${d.count?'active':''}" style="height:${Math.max(6,d.count/maxCount*90)}px"></div><div class="bar-label mono">${d.label}</div></div>`).join("")}</div>
        </div>

        ${(() => {
          const fileStats = (() => {
            const byType = {};
            state.generatedFiles.forEach(f => {
              byType[f.type] = (byType[f.type] || 0) + 1;
            });
            return byType;
          })();
          const totalFiles = state.generatedFiles.length;
          return totalFiles > 0 ? `
            <div class="section-head"><h2 class="section-title">📁 Archivos generados</h2></div>
            <div class="card">
              <div style="display:flex;gap:12px;flex-wrap:wrap">
                <div class="stat-tile"><div class="stat-num mono">${totalFiles}</div><div class="stat-label">Archivos</div></div>
                ${Object.entries(fileStats).map(([type, count]) => `<div class="stat-tile"><div class="stat-num mono">${count}</div><div class="stat-label">${type}</div></div>`).join("")}
              </div>
              <p class="lede" style="margin-top:10px">Abre el menú lateral (📁) para descargar tus archivos generados.</p>
            </div>
          ` : "";
        })()}

        <div class="section-head"><h2 class="section-title">Por Flashcards</h2></div>
        <div style="display:flex;flex-direction:column;gap:10px">
          ${state.decks.length ? state.decks.map(deckRow).join("") : `<div class="empty-note">Crea tus primeras Flashcards en la pestaña Tarjetas.</div>`}
        </div>
      </div>
    `;
    $("#stageInput").oninput = e=> state.stageDraft = e.target.value;
    $("#saveStageBtn").onclick = ()=>{
      state.profile.stage = state.stageDraft.trim() || "Primer semestre";
      saveProfile();
      toast("Etapa actualizada.");
      render();
    };
    $$(".export-deck-btn").forEach(b=> b.onclick = (e)=>{
      e.stopPropagation();
      const deck = state.decks.find(d=>d.id===b.dataset.id);
      if(!deck) return;
      const cards = state.cards.filter(c=>c.deckId===deck.id);
      const material = cards.map(c=>`P: ${c.front}\nR: ${c.back}`).join("\n\n");
      openExportMenu(deck.name, material);
    });
    $$("[data-open-deck]").forEach(el=> el.onclick = ()=>{ state.tab="cards"; openDeckDetail(el.dataset.openDeck); });
  }

  /* ---------- tabs & boot ---------- */
  $$(".tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.tab = btn.dataset.tab;
      state.review.active = false;
      render();
    });
  });

  function toggleSidebar(){
    state.sidebarOpen = !state.sidebarOpen;
    const panel = $("#sidebarPanel");
    const overlay = $("#sidebarOverlay");
    panel.classList.toggle("open", state.sidebarOpen);
    overlay.classList.toggle("open", state.sidebarOpen);
    renderSidebar();
  }

  function closeSidebar(){
    state.sidebarOpen = false;
    $("#sidebarPanel").classList.remove("open");
    $("#sidebarOverlay").classList.remove("open");
  }

  function renderSidebar(){
    if(!state.generatedFiles || !state.generatedFiles.length){
      $("#sidebarContent").innerHTML = `<div style="padding:16px;text-align:center;color:var(--ink-faint)">No hay archivos generados aún</div>`;
      return;
    }
    const byType = {};
    state.generatedFiles.forEach(f=>{
      if(!byType[f.type]) byType[f.type] = [];
      byType[f.type].push(f);
    });
    let html = "";
    Object.keys(byType).sort().forEach(type=>{
      html += `<div class="file-group">
        <div class="file-group-title">${type.toUpperCase()}</div>`;
      byType[type].sort((a,b)=>b.createdAt - a.createdAt).forEach(f=>{
        const date = new Date(f.createdAt).toLocaleDateString("es-ES", {month:"short", day:"numeric"});
        html += `<div class="file-item" data-file-id="${f.id}">
          <div class="file-name">${escapeHtml(f.name)}</div>
          <div class="file-meta">${date}</div>
        </div>`;
      });
      html += `</div>`;
    });
    $("#sidebarContent").innerHTML = html;
    $$(".file-item", $("#sidebarContent")).forEach(el=>{
      el.onclick = ()=>{
        const fileId = el.dataset.fileId;
        const file = state.generatedFiles.find(f=>f.id === fileId);
        if(file){
          if(file.blob){
            browserSave(file.name, file.blob);
            toast(`Descargando ${file.name}…`);
          } else if(window.indexedDB){
            // Intentar recuperar blob de IndexedDB
            const dbReq = indexedDB.open("Sinapsis", 1);
            dbReq.onsuccess = (e)=>{
              try{
                const tx = e.target.result.transaction("blobs", "readonly");
                const blobReq = tx.objectStore("blobs").get(fileId);
                blobReq.onsuccess = ()=>{
                  if(blobReq.result && blobReq.result.blob){
                    file.blob = blobReq.result.blob;
                    browserSave(file.name, file.blob);
                    toast(`Descargando ${file.name}…`);
                  } else {
                    toast("Archivo no disponible — fue generado en otra sesión");
                  }
                };
              }catch(err){ toast("No se pudo recuperar el archivo"); }
            };
          } else {
            toast("Archivo solo disponible en la sesión actual. Regenera si es necesario.");
          }
        }
      };
    });
  }

  $("#settingsBtn").addEventListener("click", openSettings);
  $("#filesBtn").addEventListener("click", toggleSidebar);
  $("#closeSidebarBtn").addEventListener("click", closeSidebar);
  $("#sidebarOverlay").addEventListener("click", closeSidebar);
  $("#syncFlagBtn").addEventListener("click", openSettings);
  $("#homeBtn").addEventListener("click", ()=>{ state.tab = "home"; state.review.active=false; render(); });

  // El registro del service worker vive antes de este IIFE (ver arriba) para que
  // nunca dependa de que el resto de la app arranque sin errores.
  try{ loadAll(); }catch(e){ try{ console.error("loadAll failed", e); }catch(_){} }
  try{ render(); }catch(e){ try{ console.error("initial render failed", e); }catch(_){} }
  // Deferred so the very first paint (greeting screen) never waits on the
  // Firebase SDK — cloud sync quietly connects in the background afterward.
  if(cloudConfigured()){
    const kickoff = ()=>{ try{ initCloud(); }catch(e){ try{ console.error("initCloud failed", e); }catch(_){} } };
    if("requestIdleCallback" in window) requestIdleCallback(kickoff, { timeout:2000 });
    else setTimeout(kickoff, 300);
  }
})();
</script>
</body>
</html>

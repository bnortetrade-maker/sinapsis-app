<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sinapsis</title>
<meta name="description" content="Tutor IA, flashcards, apuntes, agenda y presentaciones para estudiantes de medicina.">
<meta name="theme-color" content="#5a3fa0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sinapsis">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f2fb; --paper-soft:#efe8f9; --surface:#ffffff; --sage:#e5def2;
    --ink:#2e2540; --ink-soft:#71678c; --ink-faint:#a99cc4; --line:#ddd0f0;
    --hema:#8465c9; --hema-soft:#ece2fa; --hema-strong:#5a3fa0;
    --eosin:#c06bab; --eosin-soft:#f8e6f3;
    --good:#3f8f6d; --good-soft:#e3f2ea;
    --warn:#c98a2c; --warn-soft:#faedd8;
    --bad:#c0554f; --bad-soft:#f9e5e3;
    --shadow: 0 1px 2px rgba(46,37,64,.06), 0 6px 20px rgba(46,37,64,.07);
    --radius-s:10px; --radius-m:16px; --radius-l:24px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1c1728; --paper-soft:#241c33; --surface:#2a2138; --sage:#362d47;
      --ink:#ede6f7; --ink-soft:#b6a8d1; --ink-faint:#7c6d99; --line:#3c3050;
      --hema:#b198e8; --hema-soft:#362a52; --hema-strong:#d3c2f5;
      --eosin:#e29bd1; --eosin-soft:#402c3d;
      --good:#6fc4a0; --good-soft:#1e3830;
      --warn:#e0ab5c; --warn-soft:#3a2f18;
      --bad:#e2837c; --bad-soft:#3c231f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Archivo",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:"Fraunces",Georgia,serif; text-wrap:balance; letter-spacing:-.01em; }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  ::selection{ background:var(--eosin-soft); }
  :focus-visible{ outline:2px solid var(--hema); outline-offset:2px; border-radius:4px; }

  #app{ max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; }

  .topbar{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:baseline; gap:9px; }
  .brand-mark{ font-size:20px; }
  .brand h1{ font-size:21px; font-weight:600; margin:0; color:var(--hema-strong); }
  .badge-row{ display:flex; align-items:center; gap:8px; }
  .streak-badge{
    display:flex; align-items:center; gap:5px; background:var(--warn-soft); color:var(--warn);
    padding:5px 10px 5px 8px; border-radius:999px; font-size:13px; font-weight:600;
  }
  .sync-flag{ font-size:10px; color:var(--ink-faint); border:1px solid var(--line); border-radius:999px; padding:3px 8px; }

  main{ flex:1; padding:16px 16px 100px; overflow-x:hidden; }
  .screen{ display:flex; flex-direction:column; gap:14px; animation:rise .28s ease both; }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce){ .screen{animation:none;} }

  .eyebrow{
    font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--ink-faint);
  }
  .section-title{ font-size:19px; font-weight:600; margin:0 0 2px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .lede{ color:var(--ink-soft); font-size:13.5px; line-height:1.5; margin:0; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m);
    padding:16px; box-shadow:var(--shadow);
  }
  .specimen-tag{
    display:inline-flex; align-items:center; gap:6px; font-family:"IBM Plex Mono",monospace;
    font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--hema);
    background:var(--hema-soft); border-radius:5px; padding:3px 7px; width:fit-content;
  }

  .banner{
    display:flex; gap:10px; align-items:flex-start; background:var(--hema-soft); border:1px solid var(--line);
    border-radius:var(--radius-m); padding:12px 14px;
  }
  .banner .bicon{ font-size:18px; line-height:1.3; }
  .banner b{ color:var(--hema-strong); }
  .banner .bline{ font-size:13px; line-height:1.5; color:var(--ink); }
  .banner .bline + .bline{ margin-top:2px; }

  .btn{
    border:none; cursor:pointer; border-radius:var(--radius-s); font-weight:600; font-size:14.5px;
    padding:12px 18px; display:inline-flex; align-items:center; justify-content:center; gap:7px;
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.5; cursor:default; transform:none; }
  .btn-primary{ background:var(--hema); color:#fff; width:100%; }
  .btn-ghost{ background:transparent; color:var(--hema); border:1px solid var(--line); }
  .btn-soft{ background:var(--hema-soft); color:var(--hema-strong); }
  .btn-eosin{ background:var(--eosin); color:#fff; }
  .btn-sm{ padding:8px 13px; font-size:12.5px; border-radius:8px; }
  .btn-icon{ background:var(--sage); color:var(--ink); width:44px; height:44px; padding:0; border-radius:12px; flex:none; }
  .btn-icon.on{ background:var(--eosin); color:#fff; }
  .btn-block{ width:100%; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border:1px solid var(--line); background:var(--paper-soft); color:var(--ink); border-radius:999px;
    padding:8px 13px; font-size:13px; cursor:pointer; font-weight:500;
  }
  .chip:hover{ border-color:var(--hema); }
  .chip.active{ background:var(--hema); color:#fff; border-color:var(--hema); }

  textarea, input[type=text], input[type=date], input[type=time], input[type=password], select{
    width:100%; border:1px solid var(--line); background:var(--paper-soft); color:var(--ink);
    border-radius:var(--radius-s); padding:11px 13px; font-family:inherit; font-size:14.5px; resize:vertical;
  }
  textarea:focus, input:focus, select:focus{ border-color:var(--hema); }
  label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:6px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  /* Tutor */
  .chat-log{ display:flex; flex-direction:column; gap:10px; }
  .bubble{ max-width:86%; padding:11px 14px; border-radius:16px; font-size:14.5px; line-height:1.48; }
  .bubble.user{ align-self:flex-end; background:var(--eosin); color:#fff; border-bottom-right-radius:4px; }
  .bubble.assistant{ align-self:flex-start; background:var(--hema-soft); color:var(--ink); border-bottom-left-radius:4px; }
  .bubble.assistant.thinking{ color:var(--ink-faint); font-style:italic; }
  .msg-actions{ display:flex; gap:6px; align-self:flex-start; margin-top:-4px; }
  .composer{ position:sticky; bottom:82px; display:flex; gap:8px; background:var(--paper); padding-top:4px; }
  .composer textarea{ flex:1; max-height:110px; }

  /* Flashcards */
  .stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stat-tile{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:12px; text-align:center; }
  .stat-num{ font-size:22px; font-weight:600; }
  .stat-label{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }

  .flip-scene{ perspective:1200px; }
  .flip-card{
    position:relative; width:100%; min-height:210px; transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1); cursor:pointer;
  }
  .flip-card.flipped{ transform:rotateY(180deg); }
  .flip-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius-l);
    display:flex; flex-direction:column; justify-content:center; gap:12px; padding:26px; border:1px solid var(--line);
  }
  .flip-face.front{ background:var(--surface); }
  .flip-face.back{ background:var(--eosin-soft); transform:rotateY(180deg); }
  .flip-text{ font-family:"Fraunces",serif; font-size:19px; font-weight:500; line-height:1.35; }
  .flip-hint{ position:absolute; bottom:14px; left:0; right:0; text-align:center; font-size:11px; color:var(--ink-faint); }

  .grade-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .grade-btn{ flex-direction:column; gap:2px; padding:10px 4px; }
  .grade-btn small{ font-weight:400; font-size:10.5px; opacity:.85; }
  .g-again{ background:var(--bad-soft); color:var(--bad); }
  .g-hard{ background:var(--warn-soft); color:var(--warn); }
  .g-good{ background:var(--good-soft); color:var(--good); }
  .g-easy{ background:var(--hema-soft); color:var(--hema); }

  .deck-item{ display:flex; align-items:center; gap:12px; padding:13px 14px; border:1px solid var(--line); border-radius:var(--radius-m); background:var(--surface); }
  .deck-swatch{ width:8px; align-self:stretch; border-radius:6px; background:var(--hema); flex:none; }
  .deck-info{ flex:1; min-width:0; }
  .deck-name{ font-weight:600; font-size:14.5px; }
  .deck-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .deck-actions{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:none; }
  .due-pill{ font-size:11px; font-weight:700; background:var(--warn-soft); color:var(--warn); border-radius:999px; padding:4px 9px; flex:none; white-space:nowrap; }
  .due-pill.zero{ background:var(--good-soft); color:var(--good); }
  .due-pill.over{ background:var(--bad-soft); color:var(--bad); }
  .icon-link{ background:none; border:none; color:var(--ink-faint); font-size:11px; cursor:pointer; padding:2px; }

  /* Notes */
  .mode-switch{ display:flex; gap:8px; }
  .mode-switch .chip{ flex:1; text-align:center; }
  .note-item{ border:1px solid var(--line); border-radius:var(--radius-m); background:var(--surface); overflow:hidden; }
  .note-head{ padding:13px 14px; display:flex; justify-content:space-between; gap:8px; cursor:pointer; }
  .note-title{ font-weight:600; font-size:14.5px; }
  .note-date{ font-size:11px; color:var(--ink-faint); }
  .note-body{ padding:0 14px 14px; display:flex; flex-direction:column; gap:10px; }
  .term-chip{ background:var(--sage); border-radius:8px; padding:8px 10px; font-size:12.5px; }
  .term-chip b{ display:block; font-size:12.5px; margin-bottom:2px; }
  .note-btn-row{ display:flex; gap:8px; flex-wrap:wrap; }

  .rec-panel{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:22px 10px; }
  .rec-circle{
    width:84px; height:84px; border-radius:50%; border:none; background:var(--eosin); color:#fff; font-size:30px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 0 0 0 rgba(192,107,171,.5);
  }
  .rec-circle.active{ animation:pulse 1.6s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(192,107,171,.45);} 70%{box-shadow:0 0 0 18px rgba(192,107,171,0);} 100%{box-shadow:0 0 0 0 rgba(192,107,171,0);} }
  .rec-timer{ font-size:26px; }
  .rec-status{ font-size:12.5px; color:var(--ink-soft); }
  .transcript-box{ width:100%; min-height:90px; max-height:220px; overflow-y:auto; }

  .photo-drop{ border:1.5px dashed var(--line); border-radius:var(--radius-m); padding:22px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px; cursor:pointer; }
  .photo-preview{ width:100%; border-radius:var(--radius-m); border:1px solid var(--line); display:block; max-height:280px; object-fit:cover; }
  .answer-box{ background:var(--hema-soft); border-radius:var(--radius-m); padding:13px 14px; font-size:14px; line-height:1.5; white-space:pre-wrap; }

  /* Agenda */
  .day-group{ display:flex; flex-direction:column; gap:8px; }
  .day-label{ font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); margin-top:4px; }
  .sched-item, .reminder-item{ display:flex; align-items:center; gap:12px; padding:11px 13px; border:1px solid var(--line); border-radius:var(--radius-m); background:var(--surface); }
  .sched-time{ font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--hema-strong); font-weight:600; min-width:52px; }
  .sched-info{ flex:1; min-width:0; }
  .sched-subject{ font-weight:600; font-size:14px; }
  .sched-place{ font-size:11.5px; color:var(--ink-soft); }
  .type-chip{ font-size:10px; text-transform:uppercase; letter-spacing:.05em; padding:2px 7px; border-radius:5px; background:var(--sage); color:var(--ink-soft); width:fit-content; margin-bottom:2px; }

  /* Progress */
  .bars{ display:flex; align-items:flex-end; gap:8px; height:90px; }
  .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
  .bar{ width:100%; border-radius:5px 5px 2px 2px; background:var(--sage); min-height:4px; }
  .bar.active{ background:var(--hema); }
  .bar-label{ font-size:10px; color:var(--ink-faint); }

  .empty-note{ font-size:13px; color:var(--ink-soft); text-align:center; padding:18px 10px; }
  details.adv summary{ cursor:pointer; font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  details.adv[open] summary{ margin-bottom:8px; }

  /* Tab bar */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; max-width:520px; margin:0 auto;
    display:grid; grid-template-columns:repeat(5,1fr); background:var(--surface); border-top:1px solid var(--line);
    padding:7px 4px calc(7px + env(safe-area-inset-bottom)); box-shadow:0 -6px 20px rgba(0,0,0,.05);
  }
  .tab{
    background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px;
    color:var(--ink-faint); font-size:9.5px; font-weight:600; padding:5px 1px; cursor:pointer; border-radius:10px;
  }
  .tab .ticon{ font-size:17px; }
  .tab.active{ color:var(--hema); }

  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:var(--ink); color:var(--paper);
    padding:10px 16px; border-radius:999px; font-size:13px; z-index:50; box-shadow:var(--shadow); max-width:88%;
    text-align:center; animation:toastin .25s ease both;
  }
  @keyframes toastin{ from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);} }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">🔬</span><h1>Sinapsis</h1></div>
    <div class="badge-row">
      <div class="streak-badge"><span>🔥</span><span class="mono" id="streakCount">0</span></div>
      <span class="sync-flag mono">en este dispositivo</span>
    </div>
  </header>
  <main id="content"></main>
  <nav class="tabbar">
    <button class="tab active" data-tab="tutor"><span class="ticon">💬</span>Tutor</button>
    <button class="tab" data-tab="cards"><span class="ticon">🗂️</span>Tarjetas</button>
    <button class="tab" data-tab="notes"><span class="ticon">📝</span>Apuntes</button>
    <button class="tab" data-tab="agenda"><span class="ticon">📅</span>Agenda</button>
    <button class="tab" data-tab="progress"><span class="ticon">📈</span>Progreso</button>
  </nav>
</div>

<script>
(function(){
  "use strict";

  /* ---------- API config ---------- */
  // Clave incrustada a pedido — cualquiera con este enlace podría verla y usarla.
  // Si deja de funcionar, se puede pegar una clave nueva en Progreso → Clave de IA.
  const EMBEDDED_API_KEY = "PEGA_AQUI_TU_API_KEY_DE_ANTHROPIC";
  const MODEL_MAIN = "claude-sonnet-5";
  const MODEL_QUICK = "claude-haiku-4-5-20251001";

  function activeApiKey(){ return (localStorage.getItem("sinapsis.apiKeyOverride") || "").trim() || EMBEDDED_API_KEY; }

  async function callClaude(messages, { system, model, maxTokens } = {}){
    const key = activeApiKey();
    if(!key) throw { code: "no_key" };
    let resp;
    try{
      resp = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": key,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: model || MODEL_MAIN,
          max_tokens: maxTokens || 1024,
          system: system || undefined,
          messages,
        }),
      });
    }catch(e){ throw { code: "network" }; }
    if(!resp.ok){
      let body = null;
      try{ body = await resp.json(); }catch(e){}
      throw { code: (body && body.error && body.error.type) || "http_" + resp.status, message: body && body.error && body.error.message };
    }
    const data = await resp.json();
    const text = (data.content || []).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    return { text };
  }

  function extractJson(text){
    let s = text.trim();
    const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if(fence) s = fence[1].trim();
    try{ return JSON.parse(s); }catch(e){}
    const start = Math.min(...["{","["].map(c=>{ const i = s.indexOf(c); return i===-1? Infinity : i; }));
    const endCurly = s.lastIndexOf("}"), endSquare = s.lastIndexOf("]");
    const end = Math.max(endCurly, endSquare);
    if(start!==Infinity && end!==-1){
      try{ return JSON.parse(s.slice(start, end+1)); }catch(e){}
    }
    throw { code: "invalid_json" };
  }

  async function callClaudeJSON(prompt, opts){
    const { text } = await callClaude([{ role:"user", content: prompt }], opts);
    return extractJson(text);
  }

  function imageFileToBlock(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const dataUrl = reader.result;
        const base64 = dataUrl.slice(dataUrl.indexOf(",")+1);
        resolve({ type:"image", source:{ type:"base64", media_type: file.type || "image/jpeg", data: base64 } });
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /* ---------- state ---------- */
  const state = {
    tab: "tutor",
    chat: [], chatBusy:false, listening:false, speakingIdx:null,
    decks: [], cards: [], notes: [],
    schedule: [], reminders: [],
    profile: { stage: "Primer semestre" }, stageDraft:"",
    stats: { streakDays:0, lastStudyDate:null, totalReviews:0, correctReviews:0, daily:{} },
    review: { active:false, queue:[], idx:0, flipped:false },
    genTopic:"", genBusy:false,
    notesMode:"write", notesBusy:false, notesDraftTitle:"", notesDraftText:"",
    rec: { active:false, seconds:0, transcript:"", chunks:[], mediaRecorder:null, recog:null, timerId:null, audioBlob:null },
    photo: { file:null, previewUrl:null, question:"", answer:"", asking:false },
    schedForm: { day:"Lunes", time:"", subject:"", place:"" },
    remForm: { title:"", type:"Parcial", date:"", subject:"" },
    pptxReady:false, pptxLoading:false, apiKeyDraft:"",
  };

  const PRESET_TOPICS = ["Anatomía general","Histología","Bioquímica básica","Embriología","Terminología médica","Fisiología celular"];
  const PROMPTS = ["Explícame la mitosis como si fuera mi primera clase","¿Cuál es la diferencia entre epitelio simple y estratificado?","Dame un truco para memorizar los pares craneales","¿Para qué sirve el ciclo de Krebs, en resumen?"];
  const DAYS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
  const REM_TYPES = ["Parcial","Entrega","Trabajo"];
  const LS = {
    decks:"sinapsis.decks", cards:"sinapsis.cards", notes:"sinapsis.notes",
    schedule:"sinapsis.schedule", reminders:"sinapsis.reminders",
    stats:"sinapsis.stats", chat:"sinapsis.chat", profile:"sinapsis.profile",
  };

  const $ = (sel,el=document)=>el.querySelector(sel);
  const $$ = (sel,el=document)=>Array.from(el.querySelectorAll(sel));
  const content = $("#content");
  const todayStr = ()=> new Date().toISOString().slice(0,10);
  const escapeHtml = s => (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  /* ---------- SM-2 ---------- */
  function sm2(card, quality){
    let { ease=2.5, interval=0, reps=0 } = card;
    if(quality < 3){ reps = 0; interval = 1; }
    else{
      reps += 1;
      if(reps===1) interval = 1;
      else if(reps===2) interval = 6;
      else interval = Math.round(interval * ease);
    }
    ease = Math.max(1.3, ease + (0.1 - (5-quality)*(0.08+(5-quality)*0.02)));
    const dueAt = new Date(Date.now() + interval*86400000).toISOString();
    return { ease: Math.round(ease*100)/100, interval, reps, dueAt, lastResult: quality };
  }

  function recordReview(card, quality){
    const updated = Object.assign({}, card, sm2(card, quality));
    saveCard(updated);
    const day = todayStr();
    state.stats.totalReviews += 1;
    if(quality>=3) state.stats.correctReviews += 1;
    state.stats.daily[day] = (state.stats.daily[day]||0) + 1;
    if(state.stats.lastStudyDate !== day){
      const yest = new Date(Date.now()-86400000).toISOString().slice(0,10);
      state.stats.streakDays = (state.stats.lastStudyDate===yest) ? state.stats.streakDays+1 : 1;
      state.stats.lastStudyDate = day;
    }
    saveStats();
    $("#streakCount").textContent = state.stats.streakDays;
  }

  function todayName(){ return DAYS[(new Date().getDay()+6)%7]; }
  function daysUntil(dateStr){
    const today = new Date(todayStr()+"T00:00:00");
    const target = new Date(dateStr+"T00:00:00");
    return Math.round((target-today)/86400000);
  }
  function remindersSorted(){ return [...state.reminders].sort((a,b)=> a.date.localeCompare(b.date)); }
  function upcomingSoon(){ return remindersSorted().filter(r=> daysUntil(r.date) >= 0 && daysUntil(r.date) <= 3); }
  function todayClasses(){ return state.schedule.filter(s=>s.day===todayName()).sort((a,b)=>a.time.localeCompare(b.time)); }

  function agendaBannerHtml(){
    const classes = todayClasses(), soon = upcomingSoon();
    if(!classes.length && !soon.length) return "";
    const lines = [];
    if(classes.length) lines.push(`<div class="bline">📅 <b>Hoy:</b> ${classes.map(c=>`${escapeHtml(c.subject)} ${c.time}`).join(" · ")}</div>`);
    soon.forEach(r=>{
      const d = daysUntil(r.date);
      const when = d===0 ? "¡hoy!" : d===1 ? "mañana" : `en ${d} días`;
      lines.push(`<div class="bline">⏰ <b>${escapeHtml(r.type)}${r.subject? " de "+escapeHtml(r.subject):""}:</b> ${escapeHtml(r.title)} — ${when}</div>`);
    });
    return `<div class="banner"><span class="bicon">🔔</span><div>${lines.join("")}</div></div>`;
  }

  /* ---------- Voice ---------- */
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  const canListen = !!SpeechRec;
  const canSpeak = "speechSynthesis" in window;

  function startDictation(onFinal){
    if(!canListen) return null;
    const rec = new SpeechRec();
    rec.lang = (navigator.language||"es-ES").startsWith("es") ? navigator.language : "es-ES";
    rec.interimResults = true; rec.continuous = false;
    let finalText = "";
    rec.onresult = (e)=>{
      let interim = "";
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal) finalText += t; else interim += t;
      }
      onFinal(finalText + interim, e.results[e.results.length-1].isFinal);
    };
    rec.onerror = ()=>{};
    try{ rec.start(); }catch(e){ return null; }
    return rec;
  }

  function speakText(text, idx, onEnd){
    if(!canSpeak) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = (navigator.language||"es-ES").startsWith("es") ? navigator.language : "es-ES";
    u.onend = onEnd; u.onerror = onEnd;
    window.speechSynthesis.speak(u);
  }

  function browserSave(filename, data){
    const blob = data instanceof Blob ? data : new Blob([data], { type: filename.endsWith(".md") ? "text/markdown" : "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }

  /* ---------- Class recording ---------- */
  function startRecording(){
    state.rec = { active:true, seconds:0, transcript:"", chunks:[], mediaRecorder:null, recog:null, timerId:null, audioBlob:null };
    render();
    state.rec.timerId = setInterval(()=>{ state.rec.seconds++; const el=$("#recTimer"); if(el) el.textContent = fmtTime(state.rec.seconds); }, 1000);

    navigator.mediaDevices?.getUserMedia({ audio:true }).then(stream=>{
      try{
        const mr = new MediaRecorder(stream);
        mr.ondataavailable = e=>{ if(e.data.size>0) state.rec.chunks.push(e.data); };
        mr.onstop = ()=>{ state.rec.audioBlob = new Blob(state.rec.chunks, {type: mr.mimeType||"audio/webm"}); stream.getTracks().forEach(t=>t.stop()); render(); };
        mr.start();
        state.rec.mediaRecorder = mr;
      }catch(e){}
    }).catch(()=>{ toast("No se pudo acceder al micrófono (revisa el permiso del navegador)."); });

    if(canListen){
      const runRecognition = ()=>{
        if(!state.rec.active) return;
        const rec = new SpeechRec();
        rec.lang = (navigator.language||"es-ES").startsWith("es") ? navigator.language : "es-ES";
        rec.continuous = true; rec.interimResults = true;
        let sessionFinal = "";
        rec.onresult = (e)=>{
          let interim = "";
          for(let i=e.resultIndex;i<e.results.length;i++){
            const t = e.results[i][0].transcript;
            if(e.results[i].isFinal) sessionFinal += t + " "; else interim += t;
          }
          const box = $("#transcriptBox");
          if(box) box.value = (state.rec.transcript + " " + sessionFinal + " " + interim).trim();
        };
        rec.onend = ()=>{
          state.rec.transcript = (state.rec.transcript + " " + sessionFinal).trim();
          if(state.rec.active) runRecognition();
        };
        rec.onerror = ()=>{};
        try{ rec.start(); state.rec.recog = rec; }catch(e){}
      };
      runRecognition();
    }
  }

  function stopRecording(){
    state.rec.active = false;
    clearInterval(state.rec.timerId);
    if(state.rec.recog){ try{ state.rec.recog.stop(); }catch(e){} }
    if(state.rec.mediaRecorder && state.rec.mediaRecorder.state !== "inactive"){ try{ state.rec.mediaRecorder.stop(); }catch(e){} }
    setTimeout(render, 300);
  }

          ${canSpeak? `<button class="btn btn-soft btn-sm speak-btn" data-i="${i}">${state.speakingIdx===i? "⏹️":"🔊"}</button>`:""}
        </div>`;
      }
      return bubble;
    }).join("");
    if(state.chatBusy){
      log.innerHTML += `<div class="bubble assistant thinking">Pensando…</div>`;
    }
    $$(".to-cards-btn", log).forEach(b=>{
      b.onclick = ()=> turnAnswerIntoCards(state.chat[+b.dataset.i].content, "Del tutor");
    });
    $$(".speak-btn", log).forEach(b=>{
      b.onclick = ()=>{
        const i = +b.dataset.i;
        if(state.speakingIdx===i){ window.speechSynthesis.cancel(); state.speakingIdx=null; renderTutorList(); return; }
        state.speakingIdx = i; renderTutorList();
        speakText(state.chat[i].content, i, ()=>{ state.speakingIdx=null; renderTutorList(); });
      };
    });
    log.scrollTop = log.scrollHeight;
  }

      </div>
    </div>`;

    if(idx >= queue.length){
      content.innerHTML = `<div class="screen">
        <div class="card" style="text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:32px 20px">

      $("#doneBtn").onclick = ()=>{ state.review.active=false; render(); };
      return;
    }
    const card = queue[idx];

    content.innerHTML = `
      <div class="screen">
        <div class="section-head">

        </div>
      </div>
    `;
    $("#stageInput").oninput = e=> state.stageDraft = e.target.value;
    $("#saveStageBtn").onclick = ()=>{
      state.profile.stage = state.stageDraft.trim() || "Primer semestre";
      saveProfile();
      toast("Etapa actualizada.");
      render();
    };
    $("#apiKeyInput").oninput = e=> state.apiKeyDraft = e.target.value;
    $("#saveKeyBtn").onclick = ()=>{
      const v = state.apiKeyDraft.trim();
      if(v){ localStorage.setItem("sinapsis.apiKeyOverride", v); toast("Clave guardada en este dispositivo."); }
      else { localStorage.removeItem("sinapsis.apiKeyOverride"); toast("Se restauró la clave predeterminada."); }
    };
    $$(".pptx-deck-btn").forEach(b=> b.onclick = (e)=>{
      e.stopPropagation();
      const deck = state.decks.find(d=>d.id===b.dataset.id);
      if(!deck) return;
      const cards = state.cards.filter(c=>c.deckId===deck.id);
      const material = cards.map(c=>`P: ${c.front}\nR: ${c.back}`).join("\n\n");
      generatePresentation(deck.name, material);
    });
  }

  /* ---------- tabs & boot ---------- */
  $$(".tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.tab = btn.dataset.tab;
      state.review.active = false;
      render();
    });
  });

  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
  }

  loadAll();
  render();
})();
</script>
</body>
</html>

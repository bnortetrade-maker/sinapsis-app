<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sinapsis</title>
<meta name="description" content="Tutor IA, flashcards, apuntes, agenda y presentaciones para estudiantes de medicina.">
<meta name="theme-color" content="#5a3fa0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sinapsis">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f2fb; --paper-soft:#efe8f9; --surface:#ffffff; --sage:#e5def2;
    --ink:#2e2540; --ink-soft:#71678c; --ink-faint:#a99cc4; --line:#ddd0f0;
    --hema:#8465c9; --hema-soft:#ece2fa; --hema-strong:#5a3fa0;
    --eosin:#c06bab; --eosin-soft:#f8e6f3;
    --good:#3f8f6d; --good-soft:#e3f2ea;
    --warn:#c98a2c; --warn-soft:#faedd8;
    --bad:#c0554f; --bad-soft:#f9e5e3;
    --shadow: 0 1px 2px rgba(46,37,64,.06), 0 6px 20px rgba(46,37,64,.07);
    --radius-s:10px; --radius-m:16px; --radius-l:24px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1c1728; --paper-soft:#241c33; --surface:#2a2138; --sage:#362d47;
      --ink:#ede6f7; --ink-soft:#b6a8d1; --ink-faint:#7c6d99; --line:#3c3050;
      --hema:#b198e8; --hema-soft:#362a52; --hema-strong:#d3c2f5;
      --eosin:#e29bd1; --eosin-soft:#402c3d;
      --good:#6fc4a0; --good-soft:#1e3830;
      --warn:#e0ab5c; --warn-soft:#3a2f18;
      --bad:#e2837c; --bad-soft:#3c231f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Archivo",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:"Fraunces",Georgia,serif; text-wrap:balance; letter-spacing:-.01em; }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  ::selection{ background:var(--eosin-soft); }
  :focus-visible{ outline:2px solid var(--hema); outline-offset:2px; border-radius:4px; }

  #app{ max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; }

  .topbar{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:baseline; gap:9px; }
  .brand-mark{ font-size:20px; }
  .brand h1{ font-size:21px; font-weight:600; margin:0; color:var(--hema-strong); }
  .badge-row{ display:flex; align-items:center; gap:8px; }
  .streak-badge{
    display:flex; align-items:center; gap:5px; background:var(--warn-soft); color:var(--warn);
    padding:5px 10px 5px 8px; border-radius:999px; font-size:13px; font-weight:600;
  }
  .sync-flag{ font-size:10px; color:var(--ink-faint); border:1px solid var(--line); border-radius:999px; padding:3px 8px; background:none; cursor:pointer; font-family:inherit; }
  .sync-flag.synced{ color:var(--good); border-color:var(--good-soft); }
  .gear-btn{ background:none; border:none; font-size:18px; color:var(--ink-soft); cursor:pointer; padding:4px; line-height:1; }
  .auth-field{ display:flex; flex-direction:column; gap:10px; }
  .account-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--paper-soft); border-radius:var(--radius-s); padding:10px 12px; }
  .account-email{ font-size:13px; font-weight:600; word-break:break-all; }
  .sync-pill{ font-size:11px; font-weight:600; border-radius:999px; padding:3px 9px; }
  .sync-pill.ok{ background:var(--good-soft); color:var(--good); }
  .sync-pill.busy{ background:var(--warn-soft); color:var(--warn); }
  .sync-pill.off{ background:var(--sage); color:var(--ink-soft); }

  main{ flex:1; padding:16px 16px 100px; overflow-x:hidden; }
  .screen{ display:flex; flex-direction:column; gap:14px; animation:rise .28s ease both; }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce){ .screen{animation:none;} }

  .eyebrow{
    font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--ink-faint);
  }
  .section-title{ font-size:19px; font-weight:600; margin:0 0 2px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .lede{ color:var(--ink-soft); font-size:13.5px; line-height:1.5; margin:0; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m);
    padding:16px; box-shadow:var(--shadow);
  }
  .specimen-tag{
    display:inline-flex; align-items:center; gap:6px; font-family:"IBM Plex Mono",monospace;
    font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--hema);
    background:var(--hema-soft); border-radius:5px; padding:3px 7px; width:fit-content;
  }

  .banner{
    display:flex; gap:10px; align-items:flex-start; background:var(--hema-soft); border:1px solid var(--line);
    border-radius:var(--radius-m); padding:12px 14px;
  }
  .banner .bicon{ font-size:18px; line-height:1.3; }
  .banner b{ color:var(--hema-strong); }
  .banner .bline{ font-size:13px; line-height:1.5; color:var(--ink); }
  .banner .bline + .bline{ margin-top:2px; }

  .btn{
    border:none; cursor:pointer; border-radius:var(--radius-s); font-weight:600; font-size:14.5px;
    padding:12px 18px; display:inline-flex; align-items:center; justify-content:center; gap:7px;
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.5; cursor:default; transform:none; }
  .btn-primary{ background:var(--hema); color:#fff; width:100%; }
  .btn-ghost{ background:transparent; color:var(--hema); border:1px solid var(--line); }
  .btn-soft{ background:var(--hema-soft); color:var(--hema-strong); }
  .btn-eosin{ background:var(--eosin); color:#fff; }
  .btn-sm{ padding:8px 13px; font-size:12.5px; border-radius:8px; }
  .btn-icon{ background:var(--sage); color:var(--ink); width:44px; height:44px; padding:0; border-radius:12px; flex:none; }
  .btn-icon.on{ background:var(--eosin); color:#fff; }
  .btn-block{ width:100%; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border:1px solid var(--line); background:var(--paper-soft); color:var(--ink); border-radius:999px;
    padding:8px 13px; font-size:13px; cursor:pointer; font-weight:500;
  }
  .chip:hover{ border-color:var(--hema); }
  .chip.active{ background:var(--hema); color:#fff; border-color:var(--hema); }

  textarea, input[type=text], input[type=date], input[type=time], input[type=password], select{
    width:100%; border:1px solid var(--line); background:var(--paper-soft); color:var(--ink);
    border-radius:var(--radius-s); padding:11px 13px; font-family:inherit; font-size:14.5px; resize:vertical;
  }
  textarea:focus, input:focus, select:focus{ border-color:var(--hema); }
  label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:6px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  /* Tutor */
  .chat-log{ display:flex; flex-direction:column; gap:10px; }
  .bubble{ max-width:86%; padding:11px 14px; border-radius:16px; font-size:14.5px; line-height:1.48; }
  .bubble.user{ align-self:flex-end; background:var(--eosin); color:#fff; border-bottom-right-radius:4px; }
  .bubble.assistant{ align-self:flex-start; background:var(--hema-soft); color:var(--ink); border-bottom-left-radius:4px; }
  .bubble.assistant.thinking{ color:var(--ink-faint); font-style:italic; }
  .msg-actions{ display:flex; gap:6px; align-self:flex-start; margin-top:-4px; }
  .composer{ position:sticky; bottom:82px; display:flex; gap:8px; background:var(--paper); padding-top:4px; }
  .composer textarea{ flex:1; max-height:110px; }

  /* Flashcards */
  .stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stat-tile{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:12px; text-align:center; }
  .stat-num{ font-size:22px; font-weight:600; }
  .stat-label{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }

  .flip-scene{ perspective:1200px; }
  .flip-card{
    position:relative; width:100%; min-height:210px; transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1); cursor:pointer;
  }
  .flip-card.flipped{ transform:rotateY(180deg); }
  .flip-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius-l);
    display:flex; flex-direction:column; justify-content:center; gap:12px; padding:26px; border:1px solid var(--line);
  }
  .flip-face.front{ background:var(--surface); }
  .flip-face.back{ background:var(--eosin-soft); transform:rotateY(180deg); }
  .flip-text{ font-family:"Fraunces",serif; font-size:19px; font-weight:500; line-height:1.35; }
  .flip-hint{ position:absolute; bottom:14px; left:0; right:0; text-align:center; font-size:11px; color:var(--ink-faint); }

  .grade-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .grade-row #deleteCardBtn{ grid-column:1 / -1; margin-top:2px; }
  .grade-btn{ flex-direction:column; gap:2px; padding:10px 4px; }
  .grade-btn small{ font-weight:400; font-size:10.5px; opacity:.85; }
  .g-again{ background:var(--bad-soft); color:var(--bad); }
  .g-hard{ background:var(--warn-soft); color:var(--warn); }
  .g-good{ background:var(--good-soft); color:var(--good); }
  .g-easy{ background:var(--hema-soft); color:var(--hema); }

  .deck-item{ display:flex; align-items:center; gap:12px; padding:13px 14px; border:1px solid var(--line); border-radius:var(--radius-m); background:var(--surface); }
  .deck-swatch{ width:8px; align-self:stretch; border-radius:6px; background:var(--hema); flex:none; }
  .deck-info{ flex:1; min-width:0; }
  .deck-name{ font-weight:600; font-size:14.5px; }
  .deck-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .deck-actions{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:none; }
  .due-pill{ font-size:11px; font-weight:700; background:var(--warn-soft); color:var(--warn); border-radius:999px; padding:4px 9px; flex:none; white-space:nowrap; }
  .due-pill.zero{ background:var(--good-soft); color:var(--good); }
  .due-pill.over{ background:var(--bad-soft); color:var(--bad); }
  .icon-link{ background:none; border:none; color:var(--ink-faint); font-size:11px; cursor:pointer; padding:2px; }

  /* Notes */
  .mode-switch{ display:flex; gap:8px; }
  .mode-switch .chip{ flex:1; text-align:center; }
  .note-item{ border:1px solid var(--line); border-radius:var(--radius-m); background:var(--surface); overflow:hidden; }
  .note-head{ padding:13px 14px; display:flex; justify-content:space-between; gap:8px; cursor:pointer; }
  .note-title{ font-weight:600; font-size:14.5px; }
  .note-date{ font-size:11px; color:var(--ink-faint); }
  .note-body{ padding:0 14px 14px; display:flex; flex-direction:column; gap:10px; }
  .term-chip{ background:var(--sage); border-radius:8px; padding:8px 10px; font-size:12.5px; }
  .term-chip b{ display:block; font-size:12.5px; margin-bottom:2px; }
  .note-btn-row{ display:flex; gap:8px; flex-wrap:wrap; }

  .rec-panel{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:22px 10px; }
  .rec-circle{
    width:84px; height:84px; border-radius:50%; border:none; background:var(--eosin); color:#fff; font-size:30px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 0 0 0 rgba(192,107,171,.5);
  }
  .rec-circle.active{ animation:pulse 1.6s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(192,107,171,.45);} 70%{box-shadow:0 0 0 18px rgba(192,107,171,0);} 100%{box-shadow:0 0 0 0 rgba(192,107,171,0);} }
  .rec-timer{ font-size:26px; }
  .rec-status{ font-size:12.5px; color:var(--ink-soft); }
  .transcript-box{ width:100%; min-height:90px; max-height:220px; overflow-y:auto; }

  /* Conversación de voz (pantalla de inicio) */
  .home-wave{ display:flex; align-items:center; justify-content:center; gap:3px; height:44px; width:100%; }
  .home-wave .wave-bar{ width:4px; height:4px; border-radius:3px; background:var(--ink-faint); transition:background .25s ease; }
  .home-wave.wave-listening .wave-bar{ background:var(--hema); }
  .home-wave.wave-thinking .wave-bar{ background:var(--warn); }
  .home-wave.wave-speaking .wave-bar{ background:var(--eosin); }
  .home-voice-btn{
    width:84px; height:84px; border-radius:50%; border:none; background:var(--hema-strong); color:#fff; font-size:28px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 0 0 0 rgba(90,63,160,.5);
  }
  .home-voice-btn.on{ background:var(--eosin); animation:pulse 1.6s infinite; }
  .home-voice-status{ font-size:13px; color:var(--ink-soft); font-weight:600; min-height:18px; }
  .home-live-transcript{ font-size:13px; color:var(--ink-faint); font-style:italic; min-height:18px; text-align:center; max-width:100%; overflow-wrap:anywhere; }
  .home-chat-log{ display:flex; flex-direction:column; gap:10px; max-height:320px; overflow-y:auto; }

  .photo-drop{ border:1.5px dashed var(--line); border-radius:var(--radius-m); padding:22px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px; cursor:pointer; }
  .photo-preview{ width:100%; border-radius:var(--radius-m); border:1px solid var(--line); display:block; max-height:280px; object-fit:cover; }
  .answer-box{ background:var(--hema-soft); border-radius:var(--radius-m); padding:13px 14px; font-size:14px; line-height:1.5; white-space:pre-wrap; }

  /* Agenda */
  .day-group{ display:flex; flex-direction:column; gap:8px; }
  .day-label{ font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); margin-top:4px; }
  .sched-item, .reminder-item{ display:flex; align-items:center; gap:12px; padding:11px 13px; border:1px solid var(--line); border-radius:var(--radius-m); background:var(--surface); }
  .sched-time{ font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--hema-strong); font-weight:600; min-width:52px; }
  .sched-info{ flex:1; min-width:0; }
  .sched-subject{ font-weight:600; font-size:14px; }
  .sched-place{ font-size:11.5px; color:var(--ink-soft); }
  .type-chip{ font-size:10px; text-transform:uppercase; letter-spacing:.05em; padding:2px 7px; border-radius:5px; background:var(--sage); color:var(--ink-soft); width:fit-content; margin-bottom:2px; }

  /* Progress */
  .bars{ display:flex; align-items:flex-end; gap:8px; height:90px; }
  .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
  .bar{ width:100%; border-radius:5px 5px 2px 2px; background:var(--sage); min-height:4px; }
  .bar.active{ background:var(--hema); }
  .bar-label{ font-size:10px; color:var(--ink-faint); }

  .empty-note{ font-size:13px; color:var(--ink-soft); text-align:center; padding:18px 10px; }
  details.adv summary{ cursor:pointer; font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  details.adv[open] summary{ margin-bottom:8px; }

  /* Tab bar */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; max-width:520px; margin:0 auto;
    display:grid; grid-template-columns:repeat(5,1fr); background:var(--surface); border-top:1px solid var(--line);
    padding:7px 4px calc(7px + env(safe-area-inset-bottom)); box-shadow:0 -6px 20px rgba(0,0,0,.05);
  }
  .tab{
    background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px;
    color:var(--ink-faint); font-size:9.5px; font-weight:600; padding:5px 1px; cursor:pointer; border-radius:10px;
  }
  .tab .ticon{ font-size:17px; }
  .tab.active{ color:var(--hema); }

  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:var(--ink); color:var(--paper);
    padding:10px 16px; border-radius:999px; font-size:13px; z-index:50; box-shadow:var(--shadow); max-width:88%;
    text-align:center; animation:toastin .25s ease both;
  }
  @keyframes toastin{ from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);} }

  .modal-overlay{
    position:fixed; inset:0; z-index:60; background:rgba(20,14,32,.45);
    display:flex; align-items:flex-end; justify-content:center;
    animation:modalin .18s ease both;
  }
  @keyframes modalin{ from{opacity:0;} to{opacity:1;} }
  .modal-sheet{
    width:100%; max-width:520px; background:var(--surface); border-radius:20px 20px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom)); box-shadow:0 -8px 30px rgba(0,0,0,.2);
    animation:modalsheetin .22s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes modalsheetin{ from{transform:translateY(24px);} to{transform:translateY(0);} }

  ::-webkit-scrollbar{ width:0; height:0; }

  /* Sidebar de archivos generados */
  .sidebar-overlay{ position:fixed; inset:0; z-index:40; background:rgba(20,14,32,.3); display:none; }
  .sidebar-overlay.open{ display:block; }
  .sidebar-panel{
    position:fixed; left:0; top:0; bottom:0; width:280px; z-index:41;
    background:var(--surface); border-right:1px solid var(--line);
    display:flex; flex-direction:column; transform:translateX(-100%); transition:transform .28s ease;
  }
  .sidebar-panel.open{ transform:translateX(0); }
  .sidebar-head{
    padding:16px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .sidebar-head h3{ margin:0; font-size:16px; }
  .sidebar-close{ background:none; border:none; cursor:pointer; font-size:20px; color:var(--ink-soft); }
  .sidebar-content{ flex:1; overflow-y:auto; padding:8px; }
  .file-group{ margin-bottom:12px; }
  .file-group-title{ font-size:10px; font-weight:600; color:var(--ink-faint); text-transform:uppercase; padding:6px 8px; }
  .file-item{
    padding:10px; margin:4px 0; border-radius:8px; background:var(--paper-soft); cursor:pointer;
    border:1px solid transparent; transition:all .12s ease;
  }
  .file-item:hover{ border-color:var(--hema); background:var(--hema-soft); }
  .file-name{ font-size:13px; font-weight:500; margin-bottom:2px; word-break:break-word; }
  .file-meta{ font-size:11px; color:var(--ink-faint); }
  .sidebar-btn{
    background:none; border:none; cursor:pointer; padding:4px 8px;
    font-size:14px; color:var(--ink-soft); margin-left:auto;
  }
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="sidebar-panel" id="sidebarPanel">
  <div class="sidebar-head">
    <h3>📁 Archivos</h3>
    <button class="sidebar-close" id="closeSidebarBtn">✕</button>
  </div>
  <div class="sidebar-content" id="sidebarContent">
    <div style="padding:16px;text-align:center;color:var(--ink-faint)">No hay archivos generados aún</div>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <button class="brand" id="homeBtn" style="background:none;border:none;cursor:pointer;padding:0" aria-label="Inicio"><span class="brand-mark">🔬</span><h1>Sinapsis</h1></button>
    <div class="badge-row">
      <div class="streak-badge"><span>🔥</span><span class="mono" id="streakCount">0</span></div>
      <button class="sync-flag mono" id="syncFlagBtn">en este dispositivo</button>
      <button class="gear-btn" id="filesBtn" title="Archivos" aria-label="Archivos">📁</button>
      <button class="gear-btn" id="settingsBtn" title="Ajustes" aria-label="Ajustes">⚙️</button>
    </div>
  </header>
  <main id="content"></main>
  <nav class="tabbar">

<script>
// Registro del service worker MUY temprano, fuera de la app principal y antes
// de cualquier otro código. Si algo dentro de la app de abajo llegara a fallar
// al arrancar, esto no debe verse afectado: sin un service worker activo, Chrome
// nunca ofrece "Instalar app" / "Agregar a pantalla de inicio", y el enlace de
// instalación se queda sin reaccionar — indistinguible, para quien lo usa, de
// que "no pasa nada" al tocarlo.
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(err=>{ try{ console.error("SW register failed", err); }catch(e){} });
  });
}

(function(){
  "use strict";

  /* ---------- API config ---------- */
  // Clave incrustada a pedido — cualquiera con este enlace podría verla y usarla.
  // Si deja de funcionar, se puede pegar una clave nueva en Progreso → Clave de IA.
  const EMBEDDED_API_KEY = "PEGA_AQUI_TU_API_KEY_DE_ANTHROPIC";
  const MODEL_MAIN = "claude-sonnet-5";
  const MODEL_QUICK = "claude-haiku-4-5-20251001";

  function activeApiKey(){ return (localStorage.getItem("sinapsis.apiKeyOverride") || "").trim() || EMBEDDED_API_KEY; }

  // Herramienta de búsqueda en internet de la propia API de Claude — se usa
  // solo para presentaciones/PDF/Word (donde más importa que los datos estén
  // actualizados), nunca en el Tutor ni en las tarjetas, para no encarecer ni
  // ralentizar el uso diario.
  const WEB_SEARCH_TOOL = { type: "web_search_20250305", name: "web_search", max_uses: 4 };

  async function callClaude(messages, { system, model, maxTokens, tools } = {}){
    const key = activeApiKey();
    if(!key) throw { code: "no_key" };
    let resp;
    try{
      resp = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": key,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: model || MODEL_MAIN,
          max_tokens: maxTokens || 1024,
          system: system || undefined,
          messages,
          tools: tools || undefined,
        }),
      });
    }catch(e){ throw { code: "network" }; }
    if(!resp.ok){
      let body = null;
      try{ body = await resp.json(); }catch(e){}
      throw { code: (body && body.error && body.error.type) || "http_" + resp.status, message: body && body.error && body.error.message };
    }
    const data = await resp.json();
    const text = (data.content || []).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    return { text };
  }

  function extractJson(text){
    let s = text.trim();
    const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if(fence) s = fence[1].trim();
    try{ return JSON.parse(s); }catch(e){}
    const start = Math.min(...["{","["].map(c=>{ const i = s.indexOf(c); return i===-1? Infinity : i; }));
    const endCurly = s.lastIndexOf("}"), endSquare = s.lastIndexOf("]");
    const end = Math.max(endCurly, endSquare);
    if(start!==Infinity && end!==-1){
      try{ return JSON.parse(s.slice(start, end+1)); }catch(e){}
    }
    throw { code: "invalid_json" };
  }

  async function callClaudeJSON(prompt, opts){
    const { text } = await callClaude([{ role:"user", content: prompt }], opts);
    return extractJson(text);
  }

  function imageFileToBlock(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const dataUrl = reader.result;
        const base64 = dataUrl.slice(dataUrl.indexOf(",")+1);
        resolve({ type:"image", source:{ type:"base64", media_type: file.type || "image/jpeg", data: base64 } });
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /* ---------- Cloud sync (cuenta multiplataforma) ----------
     Firebase Auth + Firestore: la forma estándar de tener cuentas y
     sincronización entre dispositivos sin mantener un servidor propio.
     GitHub Pages solo sirve archivos estáticos, así que la nube va aquí.
     Para activarlo: crear un proyecto gratis en https://console.firebase.google.com,
     activar Authentication → Email/Password y Firestore Database, y pegar la
     configuración del proyecto ("Firebase config") abajo. Mientras tenga los
     valores de ejemplo, la app funciona igual que antes (solo en este dispositivo). */
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyD--ZrWGN8tBxHvfPli0otLeNW2S2auw6Q",
    authDomain: "sinapsis-cb2b3.firebaseapp.com",
    projectId: "sinapsis-cb2b3",
    storageBucket: "sinapsis-cb2b3.firebasestorage.app",
    messagingSenderId: "585245260030",
    appId: "1:585245260030:web:342209b50303a60f6a4daf",
  };
  function cloudConfigured(){ return !/^PEGA_AQUI/.test(FIREBASE_CONFIG.apiKey); }

  const cloud = {
    ready:false, loading:false, user:null, unsub:null, syncing:false, pulling:false,
    saveTimer:null, authError:"",
  };
  const SYNC_FIELDS = ["decks","cards","notes","schedule","reminders","stats","chat","profile","generatedFiles"];

  function loadFirebaseScripts(){
    return new Promise((resolve, reject)=>{
      if(window.firebase && window.firebase.apps){ resolve(); return; }
      const V = "10.13.2";
      const urls = [
        `https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`,
        `https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`,
        `https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`,
      ];
      const loadOne = i => {
        if(i>=urls.length) return resolve();
        const s = document.createElement("script");
        s.src = urls[i]; s.onload = ()=>loadOne(i+1); s.onerror = reject;
        document.head.appendChild(s);
      };
      loadOne(0);
    });
  }

  async function initCloud(){
    if(!cloudConfigured() || cloud.loading || cloud.ready) return;
    cloud.loading = true;
    try{
      await loadFirebaseScripts();
      if(!window.firebase.apps.length) window.firebase.initializeApp(FIREBASE_CONFIG);
      cloud.auth = window.firebase.auth();
      cloud.db = window.firebase.firestore();
      try{ await cloud.db.enablePersistence({ synchronizeTabs:true }); }catch(e){ /* multi-tab or unsupported: sigue funcionando en línea */ }
      cloud.ready = true;
      cloud.auth.onAuthStateChanged(onAuthChanged);
    }catch(e){
      cloud.authError = "No se pudo conectar con la nube ahora mismo.";
    }finally{ cloud.loading = false; if(state.tab==="settings") renderSettingsScreen(); updateSyncFlag(); }
  }

  function onAuthChanged(user){
    cloud.user = user;
    if(cloud.unsub){ cloud.unsub(); cloud.unsub = null; }
    if(user){
      cloud.pulling = true; updateSyncFlag();
      const ref = cloud.db.collection("users").doc(user.uid);
      ref.get().then(snap=>{
        if(snap.exists){
          const data = snap.data() || {};
          SYNC_FIELDS.forEach(f=>{ if(data[f]!==undefined) state[f] = data[f]; });
          persistSyncFieldsLocally();
        } else {
          // Primera vez con cuenta en cualquier dispositivo: sube lo que ya
          // había localmente para no perder nada.
          pushStateToCloud(true);
        }
        cloud.pulling = false;
        state.stageDraft = stageLabel(); state.nameDraft = state.profile.name || "";
        cloud.unsub = ref.onSnapshot(snap=>{
          if(!snap.exists || cloud.syncing) return; // ignora el eco de nuestra propia escritura
          const data = snap.data() || {};
          SYNC_FIELDS.forEach(f=>{ if(data[f]!==undefined) state[f] = data[f]; });
          persistSyncFieldsLocally();
          state.stageDraft = stageLabel(); state.nameDraft = state.profile.name || "";
          render();
        });
        render(); updateSyncFlag();
      }).catch(()=>{ cloud.pulling = false; updateSyncFlag(); });
    } else {
      updateSyncFlag();
    }
  }

  function persistSyncFieldsLocally(){
    lsSet(LS.decks, state.decks); lsSet(LS.cards, state.cards); lsSet(LS.notes, state.notes);
    lsSet(LS.schedule, state.schedule); lsSet(LS.reminders, state.reminders);
    lsSet(LS.stats, state.stats); lsSet(LS.chat, state.chat.slice(-40)); lsSet(LS.profile, state.profile);
    lsSet("sinapsis.generatedFiles", state.generatedFiles.map(f=>({ id:f.id, name:f.name, type:f.type, createdAt:f.createdAt })));
  }

  function queueCloudSync(){
    if(!cloud.ready || !cloud.user) return;
    clearTimeout(cloud.saveTimer);
    cloud.saveTimer = setTimeout(()=>pushStateToCloud(false), 900);
  }

  function pushStateToCloud(isInitialPush){
    if(!cloud.ready || !cloud.user) return;
    cloud.syncing = true; updateSyncFlag();
    const payload = {}; SYNC_FIELDS.forEach(f=> payload[f] = f==="chat" ? state.chat.slice(-40) : state[f]);
    payload.updatedAt = Date.now();
    cloud.db.collection("users").doc(cloud.user.uid).set(payload, { merge:true })
      .catch(()=>{ toast("No se pudo sincronizar con la nube (revisa tu conexión)."); })
      .finally(()=>{ setTimeout(()=>{ cloud.syncing = false; updateSyncFlag(); }, 250); });
  }

  function updateSyncFlag(){
    const btn = $("#syncFlagBtn"); if(!btn) return;
    btn.classList.toggle("synced", !!(cloud.user && !cloud.syncing && !cloud.pulling));
    if(cloud.pulling) btn.textContent = "sincronizando…";
    else if(cloud.user && cloud.syncing) btn.textContent = "guardando…";
    else if(cloud.user) btn.textContent = cloud.user.email;
    else btn.textContent = "en este dispositivo";
  }

  async function cloudSignUp(email, pass){
    await initCloud();
    if(!cloud.ready) throw new Error("no_cloud");
    return cloud.auth.createUserWithEmailAndPassword(email, pass);
  }
  async function cloudLogIn(email, pass){
    await initCloud();
    if(!cloud.ready) throw new Error("no_cloud");
    return cloud.auth.signInWithEmailAndPassword(email, pass);
  }
  function cloudLogOut(){ if(cloud.auth) cloud.auth.signOut(); }

  function authErrorCopy(e){
    if(e && e.message==="no_cloud") return "La sincronización en la nube todavía no está activada en esta app.";
    const known = ({
      "auth/email-already-in-use":"Ya existe una cuenta con ese correo — intenta iniciar sesión.",
      "auth/invalid-email":"Ese correo no parece válido.",
      "auth/weak-password":"La contraseña debe tener al menos 6 caracteres.",
      "auth/wrong-password":"Contraseña incorrecta.",
      "auth/user-not-found":"No hay cuenta con ese correo — puedes crear una.",
      "auth/network-request-failed":"No hay conexión a internet en este momento.",
      "auth/invalid-credential":"Correo o contraseña incorrectos.",
      "auth/too-many-requests":"Demasiados intentos. Espera un momento y vuelve a intentar.",
    })[e && e.code];
    return known || "No se pudo completar la operación. Intenta de nuevo.";
  }

  /* ---------- state ---------- */
  const state = {
    tab: "home", prevTab:"cards",
    decks: [], cards: [], notes: [],
    schedule: [], reminders: [],
    profile: { stage: "Primer semestre", name:"", autoSpeak:true, topics:[] }, stageDraft:"", nameDraft:"",
    stats: { streakDays:0, lastStudyDate:null, totalReviews:0, correctReviews:0, daily:{} },
    review: { active:false, queue:[], idx:0, flipped:false },
    deckDetail: null, deckDetailSelected: [],
    genTopic:"", genBusy:false, genCount:15,
    notesMode:"write", notesBusy:false, notesDraftTitle:"", notesDraftText:"",
    // "live" = solo transcripción por voz (SpeechRecognition), "audio" = solo grabar el audio (MediaRecorder).
    // Nunca se usan las dos APIs de micrófono al mismo tiempo: en Android, el sistema operativo le
    // corta el micrófono a una de las dos sin avisar, y eso es lo que dejaba la transcripción en blanco.
    recMode: "live",
    rec: { active:false, seconds:0, transcript:"", chunks:[], mediaRecorder:null, recog:null, timerId:null, audioBlob:null },
    photo: { file:null, previewUrl:null, question:"", answer:"", asking:false },
    schedForm: { day:"Lunes", time:"", subject:"", place:"" },
    remForm: { title:"", type:"Parcial", date:"", subject:"" },
    apiKeyDraft:"",
    authMode:"login", authEmail:"", authPass:"", authBusy:false,
    // Conversación de voz de la pantalla de inicio: no es un enrutador de comandos,
    // es un hilo de conversación continuo (fase: "idle"|"listening"|"thinking"|"speaking").
    homeVoice: { active:false, phase:"idle", recog:null, transcript:"", silenceStreak:0, isSpeaking:false, currentSpeechId:null },
    homeChat: [], homeTyped:"",
    // Menú lateral de archivos generados
    sidebarOpen: false, generatedFiles: [],
  };

  const PRESET_TOPICS = ["Anatomía general","Histología","Bioquímica básica","Embriología","Terminología médica","Fisiología celular"];
  const PROMPTS = ["Explícame la mitosis como si fuera mi primera clase","¿Cuál es la diferencia entre epitelio simple y estratificado?","Dame un truco para memorizar los pares craneales","¿Para qué sirve el ciclo de Krebs, en resumen?"];
  const DAYS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
  const REM_TYPES = ["Parcial","Entrega","Trabajo"];
  const LS = {
    decks:"sinapsis.decks", cards:"sinapsis.cards", notes:"sinapsis.notes",
    schedule:"sinapsis.schedule", reminders:"sinapsis.reminders",
    stats:"sinapsis.stats", chat:"sinapsis.chat", profile:"sinapsis.profile",
  };

  const $ = (sel,el=document)=>el.querySelector(sel);
  const $$ = (sel,el=document)=>Array.from(el.querySelectorAll(sel));
  const content = $("#content");
  const todayStr = ()=> new Date().toISOString().slice(0,10);
  const escapeHtml = s => (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const stageLabel = ()=> state.profile.stage || "Primer semestre";

  function lsGet(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
  function lsSet(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

  function toast(msg){
    const t = document.createElement("div");
    t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2600);
  }

  // Muestra el mensaje como toast y, si la voz automática está activada, también
  // lo lee en voz alta — para que el asistente de inicio y el tutor se sientan
  // como una conversación real, no solo texto.
  function announce(msg){
    toast(msg);
    if(canSpeak && state.profile.autoSpeak !== false){ window.speechSynthesis.cancel(); speakText(msg, null, ()=>{}); }
  }

  function errorCopy(e){
    const code = e && e.code, msg = (e && e.message) || "";
    if(/credit balance/i.test(msg)) return "La cuenta de la API no tiene saldo. Hay que cargar crédito en console.anthropic.com → Plans & Billing.";
    return ({
      no_key:"Falta configurar la clave de IA (Progreso → Clave de IA).",
      network:"No hay conexión a internet en este momento.",
      authentication_error:"La clave de IA no es válida o fue revocada.",
      permission_error:"La clave de IA no tiene permiso para esto.",
      rate_limit_error:"Muchas solicitudes seguidas. Espera un momento y vuelve a intentar.",
      overloaded_error:"El servicio de IA está saturado ahora mismo. Intenta de nuevo en un momento.",
      invalid_request_error:"Hubo un problema con la solicitud. Intenta de nuevo.",
      invalid_json:"Hubo un problema con el formato de la respuesta. Intenta de nuevo.",
    })[code] || "Ocurrió un error inesperado. Intenta de nuevo.";
  }

  /* ---------- boot ---------- */
  function loadAll(){
    state.decks = lsGet(LS.decks, []);
    state.cards = lsGet(LS.cards, []);
    state.notes = lsGet(LS.notes, []);
    state.schedule = lsGet(LS.schedule, []);
    state.reminders = lsGet(LS.reminders, []);
    state.stats = Object.assign(state.stats, lsGet(LS.stats, {}));
    state.chat = lsGet(LS.chat, []);
    state.profile = Object.assign(state.profile, lsGet(LS.profile, {}));
    if(!state.decks.length) seedLocalExample();
    state.stageDraft = stageLabel();
    state.nameDraft = state.profile.name || "";
  }

  function seedLocalExample(){
    const deckId = "example-deck";
    state.decks.push({ id: deckId, name:"Ejemplo · Tejido epitelial", topic:"Histología", example:true, createdAt: Date.now() });
    const ex = [
      ["¿Qué caracteriza al epitelio simple?","Una sola capa de células, típica de sitios de absorción o filtración (ej. alvéolos, capilares)."],
      ["¿Qué es el epitelio estratificado?","Varias capas de células; protege superficies sometidas a fricción, como la piel o el esófago."],
      ["¿Qué es una unión estrecha (tight junction)?","Un tipo de unión intercelular que sella el espacio entre células, impidiendo el paso de sustancias entre ellas."],
    ];
    ex.forEach(([front,back],i)=> state.cards.push(mkCard(deckId, front, back, i===0)));
  }

  function mkCard(deckId, front, back, dueNow){
    return { id:"c"+Math.random().toString(36).slice(2,10), deckId, front, back,
      ease:2.5, interval:0, reps:0, dueAt: dueNow ? new Date().toISOString() : new Date(Date.now()+86400000).toISOString(),
      lastResult:null, example: deckId==="example-deck" };
  }

  function saveDeckAndCards(deck, cards){
    state.decks.push(deck); cards.forEach(c=>state.cards.push(c));
    lsSet(LS.decks, state.decks); lsSet(LS.cards, state.cards); queueCloudSync();
  }
  function deleteDeck(deckId){
    state.decks = state.decks.filter(d=>d.id!==deckId);
    state.cards = state.cards.filter(c=>c.deckId!==deckId);
    lsSet(LS.decks, state.decks); lsSet(LS.cards, state.cards);
    toast("Mazo borrado");
    queueCloudSync();
  }
  function saveCard(card){
    const idx = state.cards.findIndex(c=>c.id===card.id);
    if(idx>-1) state.cards[idx] = card; else state.cards.push(card);
    lsSet(LS.cards, state.cards); queueCloudSync();
  }
  function saveNote(note){ state.notes.unshift(note); lsSet(LS.notes, state.notes); queueCloudSync(); }
  function deleteNote(noteId){
    state.notes = state.notes.filter(n=>n.id!==noteId);
    lsSet(LS.notes, state.notes);
    toast("Apunte borrado");
    queueCloudSync();
  }
  function saveStats(){ lsSet(LS.stats, state.stats); queueCloudSync(); }
  function saveChat(){ lsSet(LS.chat, state.chat.slice(-40)); queueCloudSync(); }
  function saveProfile(){ lsSet(LS.profile, state.profile); queueCloudSync(); }

  // "Auto-aprendizaje" liviano: recuerda de qué temas habló el usuario para
  // que Sinapsis pueda referirse a ellos ("la última vez viste...") y sonar
  // más cercana, sin gastar una llamada extra a la IA por cada turno.
  function rememberTopic(topic){
    const t = (topic||"").trim().replace(/\s+/g," ");
    if(!t || t.length<3) return;
    if(!Array.isArray(state.profile.topics)) state.profile.topics = [];
    state.profile.topics = state.profile.topics.filter(x=> x.toLowerCase()!==t.toLowerCase());
    state.profile.topics.unshift(t);
    state.profile.topics = state.profile.topics.slice(0,8);
    saveProfile();
  }
  function saveSchedule(){ lsSet(LS.schedule, state.schedule); queueCloudSync(); }
  function saveReminders(){ lsSet(LS.reminders, state.reminders); queueCloudSync(); }

  /* ---------- SM-2 ---------- */
  function sm2(card, quality){
    let { ease=2.5, interval=0, reps=0 } = card;
    if(quality < 3){ reps = 0; interval = 1; }
    else{
      reps += 1;
      if(reps===1) interval = 1;
      else if(reps===2) interval = 6;
      else interval = Math.round(interval * ease);
    }
    ease = Math.max(1.3, ease + (0.1 - (5-quality)*(0.08+(5-quality)*0.02)));
    const dueAt = new Date(Date.now() + interval*86400000).toISOString();
    return { ease: Math.round(ease*100)/100, interval, reps, dueAt, lastResult: quality };
  }

  function recordReview(card, quality){
    const updated = Object.assign({}, card, sm2(card, quality));
    saveCard(updated);
    const day = todayStr();
    state.stats.totalReviews += 1;
    if(quality>=3) state.stats.correctReviews += 1;
    state.stats.daily[day] = (state.stats.daily[day]||0) + 1;
    if(state.stats.lastStudyDate !== day){
      const yest = new Date(Date.now()-86400000).toISOString().slice(0,10);
      state.stats.streakDays = (state.stats.lastStudyDate===yest) ? state.stats.streakDays+1 : 1;
      state.stats.lastStudyDate = day;
    }
    saveStats();
    $("#streakCount").textContent = state.stats.streakDays;
  }

  function deleteCard(cardId){
    state.cards = state.cards.filter(c=>c.id!==cardId);
    if(state.review.active && state.review.queue){
      state.review.queue = state.review.queue.filter(c=>c.id!==cardId);
    }
    lsSet(LS.cards, state.cards); // clave correcta "sinapsis.cards" (antes escribía en 'cards' y la tarjeta reaparecía al recargar)
    toast('Tarjeta borrada');
    queueCloudSync();
  }

  function dueCards(){
    const now = new Date().toISOString();
    return state.cards.filter(c=>c.dueAt<=now).sort((a,b)=>a.dueAt.localeCompare(b.dueAt));
  }

  /* ---------- Agenda helpers ---------- */
  function todayName(){ return DAYS[(new Date().getDay()+6)%7]; }
  function daysUntil(dateStr){
    const today = new Date(todayStr()+"T00:00:00");
    const target = new Date(dateStr+"T00:00:00");
    return Math.round((target-today)/86400000);
  }
  function remindersSorted(){ return [...state.reminders].sort((a,b)=> a.date.localeCompare(b.date)); }
  function upcomingSoon(){ return remindersSorted().filter(r=> daysUntil(r.date) >= 0 && daysUntil(r.date) <= 3); }
  function todayClasses(){ return state.schedule.filter(s=>s.day===todayName()).sort((a,b)=>a.time.localeCompare(b.time)); }

  function agendaBannerHtml(){
    const classes = todayClasses(), soon = upcomingSoon();
    if(!classes.length && !soon.length) return "";
    const lines = [];
    if(classes.length) lines.push(`<div class="bline">📅 <b>Hoy:</b> ${classes.map(c=>`${escapeHtml(c.subject)} ${c.time}`).join(" · ")}</div>`);
    soon.forEach(r=>{
      const d = daysUntil(r.date);
      const when = d===0 ? "¡hoy!" : d===1 ? "mañana" : `en ${d} días`;
      lines.push(`<div class="bline">⏰ <b>${escapeHtml(r.type)}${r.subject? " de "+escapeHtml(r.subject):""}:</b> ${escapeHtml(r.title)} — ${when}</div>`);
    });
    return `<div class="banner"><span class="bicon">🔔</span><div>${lines.join("")}</div></div>`;
  }

  /* ---------- Voice ---------- */
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  const canListen = !!SpeechRec;
  const canSpeak = "speechSynthesis" in window;

  // Las voces del navegador cargan de forma ASÍNCRONA — llamar a getVoices()
  // de inmediato casi siempre devuelve [] la primera vez (bug clásico de la
  // Web Speech API), lo que hace que la voz elegida sea null y el navegador
  // caiga en su voz robótica por defecto. Se cachean apenas están listas.
  let cachedVoices = [];
  function refreshVoiceCache(){
    if(!canSpeak) return;
    const v = window.speechSynthesis.getVoices();
    if(v && v.length) cachedVoices = v;
  }
  if(canSpeak){
    refreshVoiceCache();
    window.speechSynthesis.onvoiceschanged = refreshVoiceCache;
    // Algunos navegadores (Safari/iOS) nunca disparan onvoiceschanged de forma
    // fiable — se reintenta unas veces por si acaso.
    let voiceRetries = 0;
    const voiceRetryTimer = setInterval(()=>{
      refreshVoiceCache();
      voiceRetries++;
      if(cachedVoices.length || voiceRetries>10) clearInterval(voiceRetryTimer);
    }, 300);
  }
  function pickBestSpanishVoice(){
    const voices = cachedVoices.length ? cachedVoices : (canSpeak ? window.speechSynthesis.getVoices() : []);
    if(!voices.length) return null;
    const isEs = v=> v.lang.toLowerCase().startsWith("es");
    const byName = (needle)=> voices.find(v=> isEs(v) && v.name.toLowerCase().includes(needle));
    // Las voces "Google" (Chrome/Android) suenan bastante más naturales que
    // la voz local por defecto del sistema, que suele sonar como anuncio de
    // aeropuerto/GPS ("muy instructiva"). Se prioriza esa calidad por sobre
    // solo coincidir el dialecto exacto.
    const googleArLatino = voices.find(v=> isEs(v) && v.name.toLowerCase().includes("google") && /argentin|latin/i.test(v.name));
    return googleArLatino
      || voices.find(v=> v.lang.toLowerCase()==="es-ar")
      || byName("argentin") || byName("latina") || byName("latino")
      || voices.find(v=> isEs(v) && v.name.toLowerCase().includes("google"))
      || voices.find(v=> isEs(v) && /natural|neural|premium|enhanced/i.test(v.name))
      || voices.find(v=> isEs(v))
      || null;
  }

  function startDictation(onFinal){
    if(!canListen) return null;
    const rec = new SpeechRec();
    rec.lang = (navigator.language||"es-ES").startsWith("es") ? navigator.language : "es-ES";
    rec.interimResults = true; rec.continuous = false;
    let finalText = "";
    rec.onresult = (e)=>{
      let interim = "";
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal) finalText += t; else interim += t;
      }
      onFinal(finalText + interim, e.results[e.results.length-1].isFinal);
    };
    rec.onerror = ()=>{};
    try{ rec.start(); }catch(e){ return null; }
    return rec;
  }

  function speakText(text, idx, onEnd){
    if(!canSpeak) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const chosenVoice = pickBestSpanishVoice();
    u.lang = chosenVoice ? chosenVoice.lang : "es-AR";
    u.rate = 0.82; // Conversacional, ni lenta ni apurada
    u.pitch = 1.0; // Neutral, natural
    u.volume = 1.0; // Volumen máximo natural
    u.voice = chosenVoice;

    const speechId = Math.random().toString(36).slice(2, 10);
    state.homeVoice.currentSpeechId = speechId;
    state.homeVoice.isSpeaking = true;
    render();

    // Escuchar interrupciones mientras habla
    if(state.homeVoice.active){
      listenForInterrupt(speechId);
    }

    u.onend = ()=>{
      if(state.homeVoice.currentSpeechId === speechId){
        state.homeVoice.isSpeaking = false;
        state.homeVoice.currentSpeechId = null;
        render();
      }
      onEnd && onEnd();
    };
    u.onerror = ()=>{
      if(state.homeVoice.currentSpeechId === speechId){
        state.homeVoice.isSpeaking = false;
        state.homeVoice.currentSpeechId = null;
        render();
      }
      onEnd && onEnd();
    };
    window.speechSynthesis.speak(u);
  }

  function listenForInterrupt(speechId){
    if(!canListen) return;
    const rec = new SpeechRec();
    rec.lang = (navigator.language||"es-ES").startsWith("es") ? navigator.language : "es-ES";
    rec.continuous = false; rec.interimResults = true;
    let finalText = "";
    rec.onresult = (e)=>{
      let interim = "";
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal) finalText += t + " "; else interim += t;
      }
      if(finalText.trim()){
        // Usuario interrumpió - cancelar síntesis y procesar
        if(state.homeVoice.currentSpeechId === speechId){
          window.speechSynthesis.cancel();
          state.homeVoice.isSpeaking = false;
          state.homeVoice.currentSpeechId = null;
          sendHomeVoiceTurn(finalText.trim());
        }
        rec.abort();
      }
    };
    rec.onend = ()=>{
      // Si no interrumpió, seguir escuchando si sigue hablando
      if(state.homeVoice.isSpeaking && state.homeVoice.currentSpeechId === speechId && state.homeVoice.active){
        setTimeout(()=>listenForInterrupt(speechId), 100);
      }
    };
  }

  async function browserSave(filename, data){
    const blob = data instanceof Blob ? data : new Blob([data], { type: filename.endsWith(".md") ? "text/markdown" : "application/octet-stream" });

    // En una PWA instalada (display:standalone, como Sinapsis), Android no
    // muestra ninguna confirmación visible cuando un <a download> termina —
    // el archivo SÍ se guarda en Descargas, pero en silencio, y por eso
    // parece que "no pasa nada". El diálogo nativo de Compartir/Guardar sí
    // muestra confirmación clara y deja elegir dónde guardarlo, así que se
    // intenta primero. Si el navegador no lo soporta, o el permiso ya
    // expiró (pasaron varios segundos generando el documento), se cae al
    // método de siempre — y en ambos casos se avisa bien claro dónde quedó.
    try{
      const file = new File([blob], filename, { type: blob.type });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], title: filename });
        toast(`✅ "${filename}" guardado/compartido.`);
        return;
      }
    }catch(e){ /* usuario canceló el diálogo, o no hay gesto de usuario activo — cae al método de descarga normal */ }

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast(`✅ "${filename}" guardado en tu carpeta Descargas.`);
  }

  function addGeneratedFile(filename, blob, type){
    const fileType = filename.split(".").pop().toUpperCase();
    const fileId = "f" + Math.random().toString(36).slice(2, 10);
    const file = {
      id: fileId,
      name: filename,
      type: fileType,
      blob: blob,
      createdAt: Date.now(),
    };
    state.generatedFiles.unshift(file);
    if(state.generatedFiles.length > 50) state.generatedFiles.pop();

    // Persistir blob en IndexedDB
    if(window.indexedDB){
      const dbReq = indexedDB.open("Sinapsis", 1);
      dbReq.onupgradeneeded = (e)=>{ e.target.result.createObjectStore("blobs", {keyPath:"id"}); };
      dbReq.onsuccess = (e)=>{
        try{
          const tx = e.target.result.transaction("blobs", "readwrite");
          tx.objectStore("blobs").put({ id:fileId, blob:blob });
        }catch(err){ /* IndexedDB no disponible, continúa en memoria */ }
      };
    }

    lsSet("sinapsis.generatedFiles", state.generatedFiles.map(f=>({ id:f.id, name:f.name, type:f.type, createdAt:f.createdAt })));
    queueCloudSync(); // Sincronizar metadatos de archivos generados a la nube
    if(state.sidebarOpen) renderSidebar();
    return file;
  }

  /* ---------- Class recording ---------- */
  // MediaRecorder mime support varies a lot by browser (Safari/iOS in particular
  // does not support audio/webm). Pick the first the browser actually supports.
  function pickRecorderMime(){
    if(!window.MediaRecorder || !MediaRecorder.isTypeSupported) return null;
    const candidates = ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/aac","audio/ogg;codecs=opus"];
    for(const c of candidates){ try{ if(MediaRecorder.isTypeSupported(c)) return c; }catch(e){} }
    return null;
  }

  function startRecording(){
    // Modo efectivo para esta grabación: si el navegador no soporta dictado
    // (p.ej. algunos navegadores de escritorio, o el modo "en vivo" no aplica),
    // se fuerza a solo-audio. Nunca se combinan las dos APIs de micrófono: en
    // Android, el sistema le quita el micrófono a una de las dos sin avisar
    // (ni error ni evento), y eso es lo que dejaba el cuadro de transcripción
    // vacío al grabar una clase. Cada modo usa el micrófono en exclusiva.
    const mode = canListen ? state.recMode : "audio";
    state.rec = { active:true, mode, seconds:0, transcript:"", chunks:[], mediaRecorder:null, recog:null, timerId:null, audioBlob:null, recogErrors:0, recogDenied:false };
    render();
    state.rec.timerId = setInterval(()=>{ state.rec.seconds++; const el=$("#recTimer"); if(el) el.textContent = fmtTime(state.rec.seconds); }, 1000);

    if(mode === "audio"){
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
        toast("Este navegador no permite grabar audio.");
        stopRecording();
        return;
      }
      navigator.mediaDevices.getUserMedia({ audio:true }).then(stream=>{
        // The recording could have been cancelled while the permission prompt was open.
        if(!state.rec.active){ stream.getTracks().forEach(t=>t.stop()); return; }
        try{
          const mimeType = pickRecorderMime();
          const mr = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
          mr.ondataavailable = e=>{ if(e.data.size>0) state.rec.chunks.push(e.data); };
          mr.onstop = ()=>{ state.rec.audioBlob = new Blob(state.rec.chunks, {type: mr.mimeType||"audio/webm"}); stream.getTracks().forEach(t=>t.stop()); render(); };
          mr.start();
          state.rec.mediaRecorder = mr;
        }catch(e){ toast("No se pudo iniciar la grabación de audio en este navegador."); }
      }).catch(()=>{
        // Without this, the panel was left stuck on "Grabando…" forever with the
        // timer still running — this was the main cause of the app feeling frozen.
        toast("No se pudo acceder al micrófono. Revisa el permiso de micrófono para este sitio.");
        if(!state.rec.mediaRecorder) stopRecording();
      });
      return;
    }

    // mode === "live": solo dictado por voz, sin getUserMedia/MediaRecorder.
    const runRecognition = ()=>{
      if(!state.rec.active || state.rec.recogDenied) return;
      // After repeated failures, stop retrying live transcription instead of
      // spinning forever.
      if(state.rec.recogErrors >= 4){
        const status = $(".rec-status"); if(status) status.textContent = "No se pudo transcribir. Puedes intentar de nuevo o grabar solo el audio.";
        toast("La transcripción en vivo falló varias veces seguidas. Prueba con \"Solo grabar audio\".");
        stopRecording();
        return;
      }
      const rec = new SpeechRec();
      rec.lang = (navigator.language||"es-ES").startsWith("es") ? navigator.language : "es-ES";
      // continuous:true está roto en Chrome para Android (se corta a los pocos segundos
      // sin avisar). En su lugar se encadenan sesiones cortas no continuas: cada una
      // termina sola al detectar una pausa y runRecognition() arranca la siguiente.
      rec.continuous = false; rec.interimResults = true;
      let sessionFinal = "", gotResult = false;
      rec.onresult = (e)=>{
        gotResult = true; state.rec.recogErrors = 0;
        let interim = "";
        for(let i=e.resultIndex;i<e.results.length;i++){
          const t = e.results[i][0].transcript;
          if(e.results[i].isFinal) sessionFinal += t + " "; else interim += t;
        }
        const box = $("#transcriptBox");
        if(box) box.value = (state.rec.transcript + " " + sessionFinal + " " + interim).trim();
      };
      rec.onend = ()=>{
        state.rec.transcript = (state.rec.transcript + " " + sessionFinal).trim();
        if(!gotResult) state.rec.recogErrors += 1;
        if(state.rec.active && !state.rec.recogDenied){
          // Small delay instead of restarting instantly — an immediate, unthrottled
          // restart loop on repeated errors is what pegged the CPU and froze the tab.
          // When the previous session actually captured speech, restart sooner so
          // chaining short sessions doesn't drop words between them.
          setTimeout(runRecognition, gotResult ? 150 : 500);
        }
      };
      rec.onerror = (e)=>{
        if(e && (e.error==="not-allowed" || e.error==="service-not-allowed")){
          state.rec.recogDenied = true;
          toast("Permiso de micrófono denegado para la transcripción en vivo.");
          stopRecording();
        } else if(e && e.error === "no-speech"){
          // Normal in non-continuous mode during silence — not a real error, don't count it.
        } else {
          state.rec.recogErrors += 1;
        }
      };
      try{ rec.start(); state.rec.recog = rec; }
      catch(e){ state.rec.recogErrors += 1; if(state.rec.active) setTimeout(runRecognition, 500); }
    };
    runRecognition();
  }

  function stopRecording(){
    state.rec.active = false;
    clearInterval(state.rec.timerId);
    if(state.rec.recog){ try{ state.rec.recog.stop(); }catch(e){} }
    if(state.rec.mediaRecorder && state.rec.mediaRecorder.state !== "inactive"){ try{ state.rec.mediaRecorder.stop(); }catch(e){} }
    setTimeout(render, 300);
  }

  function fmtTime(s){ const m = Math.floor(s/60), r = s%60; return `${m}:${String(r).padStart(2,"0")}`; }

  function saveRecordingAudio(){
    if(!state.rec.audioBlob){ toast("No hay audio para guardar."); return; }
    const type = state.rec.audioBlob.type || "audio/webm";
    const ext = type.includes("mp4") ? "m4a" : type.includes("ogg") ? "ogg" : type.includes("aac") ? "aac" : "webm";
    browserSave(`clase-${todayStr()}.${ext}`, state.rec.audioBlob);

  }

  /* ---------- Exportar: PPTX, PDF, Word ----------
     Cada librería es pesada (cientos de KB) y muchos estudiantes solo usarán
     uno o dos formatos — por eso cada una se descarga solo la primera vez que
     realmente se pide ese formato, nunca al abrir la app. Las tres comparten
     un único esquema generado por IA (un solo gasto de tokens) y cada una lo
     traduce a su propio formato.
  */
  function lazyScript(flagKey, src, globalCheck){
    if(state[flagKey+"Ready"]) return Promise.resolve(true);
    if(state[flagKey+"Promise"]) return state[flagKey+"Promise"];
    state[flagKey+"Promise"] = new Promise(resolve=>{
      const s = document.createElement("script");
      s.src = src;
      s.onload = ()=>{ state[flagKey+"Ready"] = !!globalCheck(); resolve(state[flagKey+"Ready"]); };
      s.onerror = ()=>{ state[flagKey+"Ready"] = false; resolve(false); };
      document.head.appendChild(s);
    });
    return state[flagKey+"Promise"];
  }
  const ensurePptxLib = ()=> lazyScript("pptx", "https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js", ()=>window.PptxGenJS);
  const ensureJsPdfLib = ()=> lazyScript("jspdf", "https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js", ()=>window.jspdf && window.jspdf.jsPDF);
  const ensureDocxLib = ()=> lazyScript("docx", "https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js", ()=>window.docx);

  async function getStudyOutline(title, materialText){

Antes de escribir, busca en internet fuentes médicas confiables y actuales (guías clínicas, revisiones, libros de texto reconocidos) para verificar u obtener datos, cifras, nombres y clasificaciones exactas — no te bases solo en lo que ya sabes de memoria.
Material ("""${title}"""): """${materialText.slice(0,3500)}"""
Para CADA sección incluye:
- "explanation": un párrafo real y completo (4-7 frases) que explique el concepto con datos concretos (mecanismos, cifras, nombres, ejemplos), como en un apunte de estudio serio — no una frase genérica.

- "flow": SOLO si la sección describe un proceso, mecanismo o secuencia (ej. un ciclo metabólico, una cascada fisiológica, un algoritmo clínico) — arreglo de 3-6 pasos concretos en orden, cada uno de 2-6 palabras. Si no aplica, usa null.
Usa table y/o flow únicamente en las secciones donde de verdad aporten claridad (no las fuerces en todas).
Responde SOLO con JSON, en español, sin texto adicional:
{"title":"...", "slides":[{"title":"...", "explanation":"...", "bullets":["...","..."], "table":{"headers":[...],"rows":[[...],...]}|null, "flow":["...","..."]|null}]}`;
    try{
      return await callClaudeJSON(prompt, { maxTokens:5000, tools:[WEB_SEARCH_TOOL] });
    }catch(e){

      // "invalid_request_error" o "permission_error" — cualquier otro fallo
      // (red, JSON mal formado en la respuesta con citas de búsqueda,
      // sobrecarga del servidor, etc.) hacía fallar TODO el documento sin
      // generar nada. Ahora se reintenta sin búsqueda ante cualquier error,
      // porque la búsqueda web es una mejora, no un requisito para generar
      // el documento.
      try{
        return await callClaudeJSON(prompt, { maxTokens:5000 });
      }catch(e2){
        console.error("getStudyOutline también falló sin búsqueda web:", e2);
        throw e2;
      }
    }
  }

  function outlineAsText(outline, title){
    const lines = [outline.title||title, ""];
    (outline.slides||[]).forEach((sl,i)=>{
      lines.push(`${i+1}. ${sl.title}`);
      if(sl.explanation) lines.push("   " + sl.explanation);
      (sl.bullets||[]).forEach(b=>lines.push("   - "+b));
      if(sl.table && sl.table.headers && sl.table.rows){
        lines.push("   " + sl.table.headers.join(" | "));
        sl.table.rows.forEach(row=> lines.push("   " + row.join(" | ")));
      }
      if(Array.isArray(sl.flow) && sl.flow.length) lines.push("   " + sl.flow.join("  →  "));
      lines.push("");
    });
    return lines.join("\n");
  }

  async function exportAs(fmt, title, materialText){
    toast("Generando documento… (busca en internet para verificar los datos, puede tardar un poco más)");
    let outline;
    try{ outline = await getStudyOutline(title, materialText); }
    catch(e){ toast(errorCopy(e)); return; }
    if(fmt==="pptx") return exportPptx(outline, title);
    if(fmt==="pdf") return exportPdf(outline, title);
    if(fmt==="docx") return exportDocx(outline, title);

  async function exportPptx(outline, title){
    const ok = await ensurePptxLib();
    if(ok && window.PptxGenJS){
      try{
        const pptx = new window.PptxGenJS();
        const cover = pptx.addSlide();
        cover.background = { color:"5A3FA0" };
        cover.addText(outline.title || title, { x:0.6,y:2.2,w:8.8,h:1.5, fontFace:"Georgia", fontSize:34, bold:true, color:"FFFFFF" });
        cover.addText("Generado con Sinapsis", { x:0.6,y:3.6,w:8,h:0.5, fontSize:14, color:"E5DEF2" });
        (outline.slides||[]).forEach(sl=>{
          const s = pptx.addSlide();
          s.background = { color:"FFFFFF" };
          s.addText(sl.title||"", { x:0.5,y:0.35,w:9,h:0.7, fontSize:22, bold:true, color:"5A3FA0", fontFace:"Georgia" });
          let y = 1.1;
          const hasExtra = (sl.table && sl.table.headers && sl.table.rows && sl.table.rows.length) || (Array.isArray(sl.flow) && sl.flow.length);
          if(sl.explanation){
            s.addText(String(sl.explanation), { x:0.6,y,w:8.8,h:0.85, fontSize:11.5, italic:true, color:"5A4A78" });
            y += 0.95;
          }
          const bulletH = hasExtra ? 1.5 : (4.6 - y + 1.1);
          if((sl.bullets||[]).length){
            s.addText((sl.bullets||[]).map(b=>({text:b, options:{bullet:true, breakLine:true}})), { x:0.6,y,w:8.8,h:bulletH, fontSize:14.5, color:"2E2540" });
            y += bulletH + 0.1;
          }
          if(sl.table && sl.table.headers && sl.table.rows && sl.table.rows.length){
            try{
              const headerRow = sl.table.headers.map(h=>({ text:String(h), options:{ bold:true, fill:{color:"EDE7F8"}, color:"5A3FA0", fontSize:11 } }));
              const bodyRows = sl.table.rows.map(row=> row.map(cell=>({ text:String(cell), options:{ fontSize:10.5, color:"2E2540" } })));
              s.addTable([headerRow, ...bodyRows], { x:0.6, y, w:8.8, autoPage:false, border:{type:"solid", color:"D8CFEE", pt:0.75}, fontFace:"Arial" });
            }catch(e){ /* si falla la tabla, la sección conserva su explicación y viñetas */ }
          } else if(Array.isArray(sl.flow) && sl.flow.length){
            try{
              const steps = sl.flow.slice(0,6);
              const gap = 0.22;
              const boxW = Math.min(2.1, (8.8 - gap*(steps.length-1)) / steps.length);
              let x = 0.6;
              steps.forEach((step,i)=>{
                s.addText(String(step), { x, y, w:boxW, h:0.8, fontSize:10.5, align:"center", valign:"middle",
                  fill:{color:"EDE7F8"}, line:{color:"8465C9", width:1}, color:"3B2F63" });
                x += boxW;
                if(i < steps.length-1){
                  s.addText("→", { x, y, w:gap, h:0.8, fontSize:15, align:"center", valign:"middle", color:"8465C9", bold:true });
                  x += gap;
                }
              });
            }catch(e){ /* si falla el diagrama, la sección conserva su explicación y viñetas */ }
          }
        });
        const blob = await pptx.write({ outputType:"blob" });
        const filename = (outline.title||title).slice(0,60)+".pptx";
        addGeneratedFile(filename, blob, "pptx");
        browserSave(filename, blob);
        toast("✅ Presentación .pptx descargada correctamente.");
        return;
      }catch(e){
        console.error("PPTX error:", e);
        toast("⚠️ Error al generar PPTX: " + (e.message || "intenta de nuevo"));
        /* cae al respaldo de texto */
      }
    }
    if(!window.PptxGenJS){
      toast("⚠️ No se pudo cargar la librería PPTX. Descargando esquema de texto…");
    }
    browserSave((outline.title||title).slice(0,60)+".txt", outlineAsText(outline, title));
    toast("Se descargó un esquema de texto — importa a PowerPoint/Slides manualmente.");
  }

  async function exportPdf(outline, title){
    const ok = await ensureJsPdfLib();
    if(!ok || !window.jspdf){
      browserSave((outline.title||title).slice(0,60)+".md", outlineAsText(outline, title));
      toast("No se pudo generar el PDF — te di el esquema en un archivo de texto.");
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:"pt", format:"a4" });
    const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
    const marginX = 48, maxW = pageW - marginX*2;
    const purple = [90,63,160], ink = [46,37,64], faint = [150,140,170], boxFill = [237,231,248], boxLine = [132,101,201];
    let y = 68;
    const ensureSpace = lines=>{ if(y + lines*15 > pageH-56){ doc.addPage(); y = 56; } };
    const truncateForCol = (text, w)=>{ const lines = doc.splitTextToSize(String(text), w); return lines[0] + (lines.length>1 ? "…" : ""); };

    function drawTable(table){
      try{
        const cols = table.headers.length;
        if(!cols) return;
        const colW = maxW / cols, rowH = 22;
        ensureSpace(3);
        doc.setFillColor(...boxFill); doc.setDrawColor(...boxLine); doc.setLineWidth(0.75);
        doc.rect(marginX, y, maxW, rowH, "FD");
        doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...purple);
        table.headers.forEach((h,i)=> doc.text(truncateForCol(h, colW-10), marginX + i*colW + 6, y + 14));
        y += rowH;
        doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...ink);
        table.rows.forEach(row=>{
          ensureSpace(2);
          doc.setDrawColor(...boxLine); doc.setLineWidth(0.5);
          doc.rect(marginX, y, maxW, rowH, "S");
          row.forEach((cell,i)=> doc.text(truncateForCol(cell, colW-10), marginX + i*colW + 6, y + 14));
          y += rowH;
        });
        y += 12;
      }catch(e){ /* si falla la tabla, el resto de la sección se conserva */ }
    }

    function drawFlow(stepsIn){
      try{
        const steps = stepsIn.slice(0,6);
        const gap = 8, arrowW = 18, boxH = 36;
        const boxW = Math.min(120, (maxW - gap*(steps.length-1) - arrowW*(steps.length-1)) / steps.length);
        ensureSpace(4);
        let x = marginX;
        doc.setFont("helvetica","bold"); doc.setFontSize(9);
        steps.forEach((step,i)=>{
          doc.setFillColor(...boxFill); doc.setDrawColor(...boxLine); doc.setLineWidth(0.75);
          doc.rect(x, y, boxW, boxH, "FD");
          doc.setTextColor(...ink);
          const lines = doc.splitTextToSize(String(step), boxW-8).slice(0,3);
          doc.text(lines, x+4, y+14);
          x += boxW;
          if(i < steps.length-1){
            const midY = y + boxH/2;
            doc.setDrawColor(...boxLine); doc.setLineWidth(1.2);
            doc.line(x+2, midY, x+arrowW-5, midY);
            doc.setFillColor(...boxLine);
            doc.triangle(x+arrowW-5, midY-4, x+arrowW-5, midY+4, x+arrowW+1, midY, "F");
            x += arrowW;
          }
        });
        y += boxH + 16;
      }catch(e){ /* si falla el diagrama, el resto de la sección se conserva */ }
    }

    doc.setFont("helvetica","bold"); doc.setFontSize(20); doc.setTextColor(...purple);
    const titleLines = doc.splitTextToSize(outline.title||title, maxW);
    doc.text(titleLines, marginX, y); y += titleLines.length*24 + 6;
    doc.setDrawColor(...purple); doc.setLineWidth(1); doc.line(marginX, y, pageW-marginX, y); y += 22;

    (outline.slides||[]).forEach(sl=>{
      ensureSpace(2);
      doc.setFont("helvetica","bold"); doc.setFontSize(13.5); doc.setTextColor(...purple);
      const hLines = doc.splitTextToSize(sl.title||"", maxW);
      doc.text(hLines, marginX, y); y += hLines.length*17 + 4;
      if(sl.explanation){
        doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(...ink);
        const eLines = doc.splitTextToSize(String(sl.explanation), maxW);
        ensureSpace(eLines.length);
        doc.text(eLines, marginX, y); y += eLines.length*13.5 + 6;
      }
      doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(...ink);
      (sl.bullets||[]).forEach(b=>{
        const bLines = doc.splitTextToSize("•  "+b, maxW-10);
        ensureSpace(bLines.length);
        doc.text(bLines, marginX+10, y); y += bLines.length*14.5 + 4;
      });
      if(sl.table && sl.table.headers && sl.table.rows && sl.table.rows.length) drawTable(sl.table);
      if(Array.isArray(sl.flow) && sl.flow.length) drawFlow(sl.flow);
      y += 10;
    });
    doc.setFont("helvetica","italic"); doc.setFontSize(8.5); doc.setTextColor(...faint);
    doc.text("Generado con Sinapsis", marginX, pageH-30);
    const filename = (outline.title||title).slice(0,60)+".pdf";
    const blob = doc.output("blob");
    addGeneratedFile(filename, blob, "pdf");
    browserSave(filename, blob);
    toast("✅ PDF descargado correctamente.");
  }

  async function exportDocx(outline, title){
    const ok = await ensureDocxLib();
    if(!ok || !window.docx){
      browserSave((outline.title||title).slice(0,60)+".md", outlineAsText(outline, title));
      toast("No se pudo generar el Word — te di el esquema en un archivo de texto.");
      return;
    }
    const { Document, Packer, Paragraph, TextRun, HeadingLevel, Table, TableRow, TableCell, WidthType, BorderStyle, AlignmentType } = window.docx;
    const children = [
      new Paragraph({ text: outline.title||title, heading: HeadingLevel.HEADING_1 }),
      new Paragraph({ children:[ new TextRun({ text:"Generado con Sinapsis", italics:true, color:"8465C9" }) ] }),
      new Paragraph({ text:"" }),
    ];

    function tryAddTable(table){
      try{
        if(!table.headers || !table.headers.length) return;
        const borderSpec = { style: BorderStyle.SINGLE, size: 2, color: "D8CFEE" };
        const borders = { top:borderSpec, bottom:borderSpec, left:borderSpec, right:borderSpec };
        const headerRow = new TableRow({
          children: table.headers.map(h=> new TableCell({
            shading: { fill: "EDE7F8" }, borders,
            children:[ new Paragraph({ children:[ new TextRun({ text:String(h), bold:true, color:"5A3FA0" }) ] }) ],
          })),
        });
        const bodyRows = (table.rows||[]).map(row=> new TableRow({
          children: row.map(cell=> new TableCell({
            borders, children:[ new Paragraph({ text:String(cell) }) ],
          })),
        }));
        children.push(new Table({ width:{ size:100, type: WidthType.PERCENTAGE }, rows:[headerRow, ...bodyRows] }));
        children.push(new Paragraph({ text:"" }));
      }catch(e){ /* si falla la tabla, el resto del documento se conserva */ }
    }

    function tryAddFlow(stepsIn){
      try{
        const steps = stepsIn.slice(0,6);
        if(!steps.length) return;
        const boxBorder = { style: BorderStyle.SINGLE, size: 2, color: "8465C9" };
        const noBorder = { style: BorderStyle.NONE };
        const cells = [];
        steps.forEach((step,i)=>{
          cells.push(new TableCell({
            shading:{ fill:"EDE7F8" },
            borders:{ top:boxBorder, bottom:boxBorder, left:boxBorder, right:boxBorder },
            width:{ size: Math.floor(80/steps.length), type: WidthType.PERCENTAGE },
            children:[ new Paragraph({ alignment: AlignmentType.CENTER, children:[ new TextRun({ text:String(step), bold:true, color:"3B2F63" }) ] }) ],
          }));
          if(i < steps.length-1){
            cells.push(new TableCell({
              width:{ size: Math.max(1, Math.floor(20/(steps.length-1))), type: WidthType.PERCENTAGE },
              borders:{ top:noBorder, bottom:noBorder, left:noBorder, right:noBorder },
              children:[ new Paragraph({ alignment: AlignmentType.CENTER, children:[ new TextRun({ text:"→", bold:true, color:"8465C9" }) ] }) ],
            }));
          }
        });
        children.push(new Table({ width:{ size:100, type: WidthType.PERCENTAGE }, rows:[ new TableRow({ children: cells }) ] }));
        children.push(new Paragraph({ text:"" }));
      }catch(e){ /* si falla el diagrama, el resto del documento se conserva */ }
    }

    (outline.slides||[]).forEach(sl=>{
      children.push(new Paragraph({ text: sl.title||"", heading: HeadingLevel.HEADING_2 }));
      if(sl.explanation) children.push(new Paragraph({ children:[ new TextRun({ text:String(sl.explanation) }) ] }));
      (sl.bullets||[]).forEach(b=> children.push(new Paragraph({ text:b, bullet:{ level:0 } })));
      if(sl.table && sl.table.headers && sl.table.rows && sl.table.rows.length) tryAddTable(sl.table);
      if(Array.isArray(sl.flow) && sl.flow.length) tryAddFlow(sl.flow);
      children.push(new Paragraph({ text:"" }));
    });
    try{
      const doc = new Document({ sections:[{ children }] });
      const blob = await Packer.toBlob(doc);
      const filename = (outline.title||title).slice(0,60)+".docx";
      addGeneratedFile(filename, blob, "docx");
      browserSave(filename, blob);
      toast("✅ Documento Word descargado correctamente.");
    }catch(e){
      console.error("DOCX error:", e);
      toast("⚠️ Error al generar Word: " + (e.message || "intenta de nuevo"));
      browserSave((outline.title||title).slice(0,60)+".txt", outlineAsText(outline, title));
      toast("Se descargó un esquema de texto — importa a Word/Docs manualmente.");
    }
  }

  // Exportar PPT + Word + Notas simultáneamente
  async function exportMultiDocument(outline, title){
    toast("📦 Generando PPT, Word y Notas...");
    const baseTitle = (outline.title||title).slice(0,60);
    const files = [];

    try{
      // 1. Generar PPTX
      if(window.PptxGenJS){
        const prs = new PptxGenJS();
        prs.defineLayout({ name:'LAYOUT1', master:'MASTER1' });
        (outline.slides||[]).forEach((sl,idx)=>{
          const slide = prs.addSlide();
          if(idx===0){
            slide.background = { color: "5A3FA0" };
            slide.addText(baseTitle, { x:0.5, y:2, w:9, h:1.5, fontSize:44, bold:true, color:"FFFFFF", align:"center" });
          } else {
            slide.addText(sl.title||"", { x:0.5, y:0.5, w:9, h:0.6, fontSize:32, bold:true, color:"5A3FA0" });
            if(sl.explanation) slide.addText(sl.explanation, { x:0.5, y:1.2, w:9, h:1.2, fontSize:14, color:"333333" });
            (sl.bullets||[]).forEach((b,i)=> slide.addText("• "+b, { x:0.7, y:2.5+i*0.35, w:8.8, h:0.3, fontSize:12, color:"555555" }));
          }
        });
        const pptxBlob = await prs.writeFile({ fileName: baseTitle });
        const pptxFilename = baseTitle+".pptx";
        addGeneratedFile(pptxFilename, pptxBlob, "pptx");
        files.push({name: pptxFilename, blob: pptxBlob});
      }
    }catch(e){ console.error("Error en PPTX:", e); }

    try{
      // 2. Generar DOCX
      const ok = await ensureDocxLib();
      if(ok && window.docx){
        const { Document, Packer, Paragraph, TextRun, HeadingLevel } = window.docx;
        const children = [
          new Paragraph({ text: baseTitle, heading: HeadingLevel.HEADING_1 }),
          new Paragraph({ children:[ new TextRun({ text:"Guía completa — Generado con Sinapsis", italics:true, color:"8465C9" }) ] }),
          new Paragraph({ text:"" }),
        ];
        (outline.slides||[]).forEach(sl=>{
          children.push(new Paragraph({ text: sl.title||"", heading: HeadingLevel.HEADING_2 }));
          if(sl.explanation) children.push(new Paragraph({ children:[ new TextRun({ text:String(sl.explanation) }) ] }));
          (sl.bullets||[]).forEach(b=> children.push(new Paragraph({ text:b, bullet:{ level:0 } })));
        });
        const doc = new Document({ sections:[{ children }] });
        const docxBlob = await Packer.toBlob(doc);
        const docxFilename = baseTitle+"_Guía.docx";
        addGeneratedFile(docxFilename, docxBlob, "docx");
        files.push({name: docxFilename, blob: docxBlob});
      }
    }catch(e){ console.error("Error en DOCX:", e); }

    // 3. Generar Notas (TXT)
    try{
      let notasText = "📝 NOTAS PARA LA PRESENTACIÓN\n";
      notasText += "=".repeat(50)+"\n\n";
      notasText += "Título: "+baseTitle+"\n";
      notasText += "Generado con Sinapsis\n\n";
      (outline.slides||[]).forEach((sl,idx)=>{
        notasText += `\n[Diapositiva ${idx}] ${sl.title||""}\n`;
        notasText += "-".repeat(40)+"\n";
        if(sl.explanation) notasText += "Explicación: "+sl.explanation+"\n";
        if(sl.bullets && sl.bullets.length) notasText += "Puntos clave:\n"+sl.bullets.map(b=>"  • "+b).join("\n")+"\n";
        notasText += "\n💡 Tips para presentar:\n";
        notasText += "  • Mira al público mientras hablas\n";
        notasText += "  • Haz pausas después de puntos importantes\n";
        notasText += "  • Usa ejemplos reales para ilustrar conceptos\n";
      });
      notasText += "\n\nTiempos recomendados:\n";
      notasText += "  • Introducción: 2-3 minutos\n";
      notasText += `  • Contenido: ${Math.ceil((outline.slides||[]).length * 3)} minutos\n`;
      notasText += "  • Conclusión: 1-2 minutos\n";
      const notasBlob = new Blob([notasText], { type:"text/plain" });
      const notasFilename = baseTitle+"_Notas.txt";
      addGeneratedFile(notasFilename, notasBlob, "txt");
      files.push({name: notasFilename, blob: notasBlob});
    }catch(e){ console.error("Error en Notas:", e); }

    // Descargar archivos uno por uno (en serie, no en paralelo) — el diálogo
    // nativo de compartir/guardar no admite abrir varios a la vez.
    for(const f of files){ await browserSave(f.name, f.blob); }
    toast(`✅ ${files.length} archivo${files.length===1?"":"s"} generado${files.length===1?"":"s"}: PPT, Word y Notas`);
  }

${name ? `Se llama ${name}. Usá su nombre cuando surja natural, no en cada frase — como lo haría cualquiera que ya la conoce.` : ""}${topics.length ? ` Ya hablaron antes de ${topics.slice(0,3).join(", ")}, así que si viene al caso podés retomarlo con soltura.` : ""}

Cuando te pregunte algo, respondé como en una conversación real: al grano, en frases que se puedan decir en voz alta, sin listas ni formato de texto para leer en pantalla. Si el tema da para mucho, contá lo esencial primero y seguí en el próximo intercambio si hace falta.

  function homeVoiceStatusText(){
    const p = state.homeVoice.phase;
    if(p==="listening") return "Escuchando…";
